<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>鳴らし鬼 — 嘘つき探しゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #171726;
    --panel: #20213a;
    --panel-2: #262848;
    --line: #363867;
    --ink: #f1eee6;
    --ink-dim: #a19fc4;
    --bell: #e8a33d;
    --bell-dim: #6b5427;
    --liar: #d1495b;
    --honest: #4fb3a9;
    --shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, #262a52 0%, transparent 55%),
      radial-gradient(circle at 100% 0%, #2a1f3d 0%, transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 16px;
  }
  #app{ width:100%; max-width: 440px; }
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px 24px;
    box-shadow: var(--shadow);
    animation: rise .35s ease;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform:none; } }
  h1.title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 30px;
    line-height:1.15;
    margin: 0 0 6px;
    letter-spacing: -.01em;
  }
  .lede{ color: var(--ink-dim); font-size: 14px; margin: 0 0 22px; line-height:1.6; }
  label{ display:block; font-size: 13px; color: var(--ink-dim); margin: 16px 0 6px; }
  input[type=text]{
    width:100%; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
    font-size: 16px; font-family:'Inter',sans-serif; outline:none;
  }
  input[type=text]:focus{ border-color: var(--bell); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding: 14px 16px; border-radius: 12px; border: none;
    font-size: 15px; font-weight:600; cursor:pointer; margin-top: 18px;
    font-family:'Inter',sans-serif; transition: transform .12s ease, filter .12s ease;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{ background: var(--bell); color: #1a1406; }
  .btn-primary:hover{ filter: brightness(1.06); }
  .btn-ghost{ background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }
  .btn-ghost:hover{ color: var(--ink); border-color:#4a4d82; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .room-tag{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--panel-2); border:1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 18px;
  }
  .room-tag .code{ font-family:'Fraunces', serif; font-size: 19px; font-weight:700; letter-spacing:.03em; }
  .room-tag button{
    background:none; border:none; color: var(--ink-dim); font-size:12px; cursor:pointer;
    padding: 4px 8px; border-radius:8px;
  }
  .room-tag button:hover{ color: var(--ink); background:#31335a; }
  .players{ list-style:none; margin: 0 0 6px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .players li{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--panel-2); border:1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; font-size: 14px;
  }
  .players li .tag{ font-size:11px; color: var(--bell); border:1px solid var(--bell-dim); padding:2px 7px; border-radius:999px; }
  .players li.me{ border-color:#4a4d82; }
  .section-label{ font-size:12px; color: var(--ink-dim); letter-spacing:.02em; margin: 20px 0 8px; }
  .role-box{ text-align:center; padding: 22px 10px 8px; }
  .role-box .role-icon{ font-size: 44px; line-height:1; margin-bottom: 10px; }
  .role-box h2{ font-family:'Fraunces',serif; font-size: 24px; margin: 0 0 8px; }
  .role-box p{ color: var(--ink-dim); font-size: 13.5px; line-height:1.6; margin:0; }
  .role-liar h2{ color: var(--liar); }
  .role-honest h2{ color: var(--honest); }
  .bell-wrap{ display:flex; flex-direction:column; align-items:center; margin: 26px 0 6px; }
  .bell-btn{
    width: 148px; height:148px; border-radius: 50%; border: none; cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #f4c876, var(--bell) 70%);
    box-shadow: 0 12px 0 var(--bell-dim), 0 18px 30px rgba(0,0,0,.5);
    font-size: 54px; color:#241a05; transition: transform .06s ease, box-shadow .06s ease;
  }
  .bell-btn:active{ transform: translateY(8px); box-shadow: 0 4px 0 var(--bell-dim), 0 8px 16px rgba(0,0,0,.5); }
  .bell-btn.ring{ animation: shake .4s ease; }
  @keyframes shake{ 10%,90%{ transform: translateX(-2px);} 20%,80%{ transform: translateX(4px);} 30%,50%,70%{ transform: translateX(-8px);} 40%,60%{ transform: translateX(8px);} }
  .bell-hint{ font-size: 12px; color: var(--ink-dim); margin-top: 14px; text-align:center; }
  .flash{
    text-align:center; font-size: 13px; color: var(--bell); min-height: 18px; margin-top: 10px;
  }
  .vote-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .vote-list li{
    border:1px solid var(--line); background: var(--panel-2); border-radius: 12px;
    padding: 12px 14px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .vote-list li.picked{ border-color: var(--bell); background: #302711; }
  .vote-progress{ font-size:12px; color: var(--ink-dim); text-align:center; margin-top: 14px; }
  .reveal{ text-align:center; padding: 10px 0 4px; }
  .reveal .who{ font-family:'Fraunces',serif; font-size: 26px; color: var(--liar); margin: 6px 0 4px; }
  .tally{ list-style:none; margin: 18px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .tally li{ display:flex; align-items:center; gap:10px; font-size: 13px; }
  .tally .bar-track{ flex:1; background:#141428; border-radius:999px; height:8px; overflow:hidden; }
  .tally .bar-fill{ height:100%; background: var(--bell); border-radius:999px; }
  .tally .count{ width: 22px; text-align:right; color: var(--ink-dim); }
  .err{ color: var(--liar); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .foot-note{ font-size: 11px; color: #6b6b8c; text-align:center; margin-top: 18px; line-height:1.6; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase (compat SDK, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
/* ---------------- Firebase 初期化 ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDWxhILNkj0RrOV248Bh2zoFZfNq2G-3N0",
  authDomain: "zoukin-kart.firebaseapp.com",
  projectId: "zoukin-kart",
  storageBucket: "zoukin-kart.firebasestorage.app",
  messagingSenderId: "627298939041",
  appId: "1:627298939041:web:3dafaed8c6d267f1d780e0",
  measurementId: "G-DDW4R9EXW5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ---------------- プレイヤーID（端末ごとに固定） ---------------- */
function getPlayerId(){
  let id = localStorage.getItem('lieBellPlayerId');
  if(!id){
    id = 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    localStorage.setItem('lieBellPlayerId', id);
  }
  return id;
}
const myId = getPlayerId();

/* ---------------- 効果音（ベル音を Web Audio で合成） ---------------- */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function playBell(){
  ensureAudio();
  const now = audioCtx.currentTime;
  [880, 1320].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = i === 0 ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(i === 0 ? 0.35 : 0.12, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.9);
  });
}

/* ---------------- 部屋コード（合言葉）の正規化 ---------------- */
function sanitizeRoomCode(raw){
  return raw.trim().replace(/[\/\.\s]+/g, '_').slice(0, 80);
}

/* ---------------- アプリの状態 ---------------- */
let myName = localStorage.getItem('lieBellName') || '';
let roomId = null;
let roomData = null;
let unsub = null;
let lastSoundId = null;
let firstSnapshot = true;
let flashMsg = '';
let joinError = '';
let voteChoice = null;

const appEl = document.getElementById('app');

/* ---------------- Firestore 参加処理 ---------------- */
async function joinRoom(name, codeRaw){
  const code = sanitizeRoomCode(codeRaw);
  if(!name.trim() || !code){
    joinError = '名前と合言葉を入力してください';
    render();
    return;
  }
  ensureAudio();
  myName = name.trim();
  localStorage.setItem('lieBellName', myName);
  roomId = code;
  const ref = db.collection('rooms').doc(roomId);

  try{
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if(!snap.exists){
        tx.set(ref, {
          hostId: myId,
          status: 'lobby',
          round: 0,
          liarId: null,
          soundEvent: null,
          votes: {},
          players: { [myId]: { name: myName, joinedAt: Date.now() } }
        });
      } else {
        tx.update(ref, { [`players.${myId}`]: { name: myName, joinedAt: Date.now() } });
      }
    });
  }catch(e){
    joinError = '参加に失敗しました。Firestore の設定をご確認ください。(' + e.message + ')';
    render();
    return;
  }

  joinError = '';
  subscribeRoom();
}

function subscribeRoom(){
  const ref = db.collection('rooms').doc(roomId);
  firstSnapshot = true;
  unsub = ref.onSnapshot((snap) => {
    if(!snap.exists) return;
    roomData = snap.data();

    const se = roomData.soundEvent;
    if(firstSnapshot){
      lastSoundId = se ? se.id : null;
      firstSnapshot = false;
    } else if(se && se.id !== lastSoundId){
      lastSoundId = se.id;
      playBell();
      flashMsg = (se.name || '誰か') + ' さんが鳴らしました 🔔';
      shakeBell();
      setTimeout(() => { flashMsg = ''; render(); }, 1600);
    }
    render();
  });
}

function shakeBell(){
  const btn = document.querySelector('.bell-btn');
  if(!btn) return;
  btn.classList.remove('ring');
  void btn.offsetWidth;
  btn.classList.add('ring');
}

/* ---------------- ゲーム操作 ---------------- */
function ref(){ return db.collection('rooms').doc(roomId); }

function startGame(){
  const ids = Object.keys(roomData.players || {});
  if(ids.length < 3){ return; }
  const liarId = ids[Math.floor(Math.random() * ids.length)];
  ref().update({
    status: 'playing',
    liarId,
    round: (roomData.round || 0) + 1,
    soundEvent: null,
    votes: {}
  });
}

function ringBell(){
  ensureAudio();
  ref().update({
    soundEvent: {
      id: 'e_' + Math.random().toString(36).slice(2, 10) + Date.now(),
      by: myId,
      name: myName,
      ts: Date.now()
    }
  });
}

function goToVoting(){
  ref().update({ status: 'voting', votes: {} });
}

function castVote(targetId){
  voteChoice = targetId;
  ref().update({ [`votes.${myId}`]: targetId });
  render();
}

function goToResult(){
  ref().update({ status: 'result' });
}

function playAgain(){
  const ids = Object.keys(roomData.players || {});
  if(ids.length < 3) return;
  let liarId = ids[Math.floor(Math.random() * ids.length)];
  ref().update({
    status: 'playing',
    liarId,
    round: (roomData.round || 0) + 1,
    soundEvent: null,
    votes: {}
  });
}

function backToLobby(){
  ref().update({ status: 'lobby', liarId: null, soundEvent: null, votes: {} });
}

/* ---------------- 画面描画 ---------------- */
function render(){
  if(!roomId || !roomData){
    renderEntry();
    return;
  }
  const status = roomData.status;
  if(status === 'lobby') renderLobby();
  else if(status === 'playing') renderPlaying();
  else if(status === 'voting') renderVoting();
  else if(status === 'result') renderResult();
}

function renderEntry(){
  appEl.innerHTML = `
    <div class="card">
      <h1 class="title">鳴らし鬼</h1>
      <p class="lede">ひとりだけ嘘つき。嘘つきはいつでもベルを鳴らせる。みんなで質問して、最後に投票で見破ろう。</p>
      <label>名前</label>
      <input id="nameInput" type="text" maxlength="12" placeholder="例：ゆうき" value="${escapeHtml(myName)}">
      <label>合言葉（部屋のパスワード）</label>
      <input id="codeInput" type="text" maxlength="30" placeholder="例：よるのひみつ">
      <button class="btn btn-primary" id="joinBtn">部屋に入る</button>
      <div class="err">${joinError}</div>
      <div class="foot-note">同じ合言葉を入力した人同士が同じ部屋につながります。部屋が無ければ自動的に作られます。</div>
    </div>
  `;
  document.getElementById('joinBtn').onclick = () => {
    joinRoom(document.getElementById('nameInput').value, document.getElementById('codeInput').value);
  };
}

function renderLobby(){
  const players = roomData.players || {};
  const ids = Object.keys(players);
  const isHost = roomData.hostId === myId;
  appEl.innerHTML = `
    <div class="card">
      <h1 class="title">ロビー</h1>
      <p class="lede">全員そろったらホストがゲームを開始します。</p>
      <div class="room-tag">
        <span class="code">${escapeHtml(roomId)}</span>
        <button id="copyBtn">合言葉をコピー</button>
      </div>
      <div class="section-label">参加者（${ids.length}人）</div>
      <ul class="players">
        ${ids.map(id => `
          <li class="${id === myId ? 'me' : ''}">
            <span>${escapeHtml(players[id].name)}${id === myId ? '（あなた）' : ''}</span>
            ${id === roomData.hostId ? '<span class="tag">ホスト</span>' : ''}
          </li>
        `).join('')}
      </ul>
      ${isHost
        ? `<button class="btn btn-primary" id="startBtn" ${ids.length < 3 ? 'disabled' : ''}>ゲーム開始</button>
           ${ids.length < 3 ? '<div class="err">3人以上で開始できます</div>' : ''}`
        : `<div class="bell-hint" style="margin-top:20px;">ホストの開始を待っています…</div>`
      }
    </div>
  `;
  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard?.writeText(roomId);
  };
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = startGame;
}

function renderPlaying(){
  const isLiar = roomData.liarId === myId;
  const isHost = roomData.hostId === myId;
  const players = roomData.players || {};
  appEl.innerHTML = `
    <div class="card">
      <div class="role-box ${isLiar ? 'role-liar' : 'role-honest'}">
        <div class="role-icon">${isLiar ? '🤥' : '🕵️'}</div>
        <h2>${isLiar ? 'あなたが嘘つきです' : 'あなたは正直者です'}</h2>
        <p>${isLiar ? 'みんなの質問にバレないよう答えよう。好きなタイミングでベルを鳴らせます。' : 'みんなで質問して、嘘つきを見つけ出そう。'}</p>
      </div>
      <div class="bell-wrap">
        <button class="bell-btn" id="bellBtn">🔔</button>
        <div class="bell-hint">誰でも、いつでも鳴らせます</div>
        <div class="flash">${flashMsg}</div>
      </div>
      ${isHost ? `<button class="btn btn-primary" id="voteBtn">投票へ進む</button>` : ''}
      <div class="foot-note">${Object.keys(players).length}人でプレイ中・ラウンド${roomData.round || 1}</div>
    </div>
  `;
  document.getElementById('bellBtn').onclick = ringBell;
  const voteBtn = document.getElementById('voteBtn');
  if(voteBtn) voteBtn.onclick = goToVoting;
}

function renderVoting(){
  const players = roomData.players || {};
  const ids = Object.keys(players);
  const votes = roomData.votes || {};
  const myVote = votes[myId];
  const votedCount = Object.keys(votes).length;
  const isHost = roomData.hostId === myId;
  appEl.innerHTML = `
    <div class="card">
      <h1 class="title">投票</h1>
      <p class="lede">誰が嘘つきだと思いますか？</p>
      <ul class="vote-list">
        ${ids.map(id => `
          <li data-id="${id}" class="${myVote === id ? 'picked' : ''}">
            <span>${escapeHtml(players[id].name)}${id === myId ? '（あなた）' : ''}</span>
            ${myVote === id ? '<span>✓</span>' : ''}
          </li>
        `).join('')}
      </ul>
      <div class="vote-progress">${votedCount} / ${ids.length} 人が投票済み</div>
      ${isHost ? `<button class="btn btn-primary" id="resultBtn">結果を見る</button>` : ''}
    </div>
  `;
  appEl.querySelectorAll('.vote-list li').forEach(li => {
    li.onclick = () => castVote(li.dataset.id);
  });
  const resultBtn = document.getElementById('resultBtn');
  if(resultBtn) resultBtn.onclick = goToResult;
}

function renderResult(){
  const players = roomData.players || {};
  const ids = Object.keys(players);
  const votes = roomData.votes || {};
  const liarId = roomData.liarId;
  const isHost = roomData.hostId === myId;

  const tally = {};
  ids.forEach(id => tally[id] = 0);
  Object.values(votes).forEach(v => { if(tally[v] !== undefined) tally[v]++; });
  const maxVotes = Math.max(1, ...Object.values(tally));

  const topVoted = ids.filter(id => tally[id] === Math.max(...Object.values(tally)) && tally[id] > 0);
  const caught = topVoted.length === 1 && topVoted[0] === liarId;

  appEl.innerHTML = `
    <div class="card">
      <div class="reveal">
        <div class="section-label">嘘つきは…</div>
        <div class="who">${escapeHtml(players[liarId]?.name || '不明')}</div>
        <p class="lede" style="margin-top:6px;">${caught ? 'みんなが見破りました！🎉' : '嘘つきは逃げ切りました…🕶️'}</p>
      </div>
      <div class="section-label">投票結果</div>
      <ul class="tally">
        ${ids.map(id => `
          <li>
            <span style="width:76px; flex-shrink:0;">${escapeHtml(players[id].name)}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${(tally[id]/maxVotes)*100}%"></span></span>
            <span class="count">${tally[id]}</span>
          </li>
        `).join('')}
      </ul>
      ${isHost ? `
        <button class="btn btn-primary" id="againBtn">もう一度あそぶ</button>
        <button class="btn btn-ghost" id="lobbyBtn">ロビーに戻る</button>
      ` : `<div class="bell-hint" style="margin-top:20px;">ホストの操作を待っています…</div>`}
    </div>
  `;
  const againBtn = document.getElementById('againBtn');
  if(againBtn) againBtn.onclick = playAgain;
  const lobbyBtn = document.getElementById('lobbyBtn');
  if(lobbyBtn) lobbyBtn.onclick = backToLobby;
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>
</body>
</html>
