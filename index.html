<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>同時視聴ルーム</title>
<style>
  :root{
    --bg:#10121A;
    --panel:#191C28;
    --panel-2:#21253A;
    --border:rgba(255,255,255,0.08);
    --accent:#FFB454;
    --accent-dim:#8A5E24;
    --danger:#FF5C5C;
    --text:#F1F1F4;
    --text-dim:#9AA0B8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% -10%, #1c2036 0%, #10121A 55%);
    color:var(--text);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{min-height:100dvh; display:flex; flex-direction:column;}
  .screen{display:none; flex:1; flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- HOME ---------- */
  #screen-home{align-items:center; justify-content:center; padding:32px 20px;}
  .home-card{
    width:100%; max-width:400px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px 24px 32px;
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-bottom:4px;}
  .brand .glow{
    width:10px; height:10px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 14px 3px var(--accent);
    display:inline-block;
  }
  .brand h1{font-size:21px; margin:0; font-weight:700; letter-spacing:.01em;}
  .brand-sub{color:var(--text-dim); font-size:13px; margin:0 0 26px;}

  label{display:block; font-size:12.5px; color:var(--text-dim); margin:18px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--panel-2);
    color:var(--text); font-size:15px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  .row-inline{display:flex; gap:8px;}
  .row-inline input{flex:1;}

  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:10px; padding:12px 16px; font-size:14.5px; font-weight:600;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-accent{background:var(--accent); color:#221202;}
  .btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(255,92,92,0.4);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px; font-size:13px;}
  .actions{display:flex; flex-direction:column; gap:10px; margin-top:24px;}
  .hint{color:var(--text-dim); font-size:11.5px; margin-top:6px; line-height:1.5;}
  .error-msg{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px;}

  /* ---------- ROOM ---------- */
  #screen-room{height:100dvh; overflow:hidden;}
  .room-header{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-bottom:1px solid var(--border);
    background:var(--panel);
    flex-shrink:0;
  }
  .room-title{display:flex; flex-direction:column; min-width:0;}
  .room-title .rid{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .room-title .sub{font-size:10.5px; color:var(--text-dim);}
  .spacer{flex:1;}
  .icon-btn{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:8px 10px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .icon-btn.danger{color:var(--danger); border-color:rgba(255,92,92,.35);}

  .participants{
    display:flex; gap:6px; padding:8px 14px; overflow-x:auto;
    border-bottom:1px solid var(--border); background:var(--panel); flex-shrink:0;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--border);
    padding:5px 10px 5px 5px; border-radius:999px; font-size:12px; white-space:nowrap;
  }
  .chip .dot{
    width:20px; height:20px; border-radius:50%; background:var(--accent);
    color:#221202; font-weight:700; font-size:11px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  .room-body{flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden;}

  .video-col{display:flex; flex-direction:column; flex-shrink:0;}
  .video-wrap{position:relative; width:100%; aspect-ratio:16/9; background:#000;}
  #player{position:absolute; inset:0; width:100%; height:100%;}
  .video-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:6px; color:var(--text-dim); font-size:13px; text-align:center; padding:20px;
  }

  .load-row{
    display:flex; gap:8px; padding:10px 14px; background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .load-row input{flex:1;}

  .tabbar{display:flex; gap:4px; padding:8px 14px 0; background:var(--panel); flex-shrink:0;}
  .tab{
    flex:1; text-align:center; padding:9px 6px; font-size:12.5px; font-weight:600;
    color:var(--text-dim); border-bottom:2px solid transparent; cursor:pointer;
  }
  .tab.active{color:var(--accent); border-color:var(--accent);}

  .panels{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--panel);}
  .panel{flex:1; min-height:0; display:none; flex-direction:column;}
  .panel.active{display:flex;}

  /* chat */
  #chat-messages{flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px;}
  .msg{max-width:86%; font-size:13.5px; line-height:1.45;}
  .msg .name{font-size:11px; color:var(--accent); margin-bottom:2px; font-weight:700;}
  .msg .text{background:var(--panel-2); padding:8px 11px; border-radius:12px; display:inline-block; word-break:break-word;}
  .msg.me{align-self:flex-end;}
  .msg.me .name{text-align:right; color:var(--text-dim);}
  .msg.me .text{background:var(--accent-dim); color:#fff;}
  .msg.system{align-self:center; color:var(--text-dim); font-size:11.5px;}
  .msg.system .text{background:transparent; padding:2px;}

  .chat-input-row{
    display:flex; gap:8px; padding:10px 14px;
    border-top:1px solid var(--border);
    padding-bottom:max(10px, env(safe-area-inset-bottom));
  }
  .chat-input-row input{flex:1;}

  /* comments panel */
  #panel-comments{padding:20px 18px; align-items:center; justify-content:center; text-align:center; gap:10px; overflow-y:auto;}
  #panel-comments p{color:var(--text-dim); font-size:13px; line-height:1.6; max-width:320px;}
  #panel-comments a.btn{text-decoration:none; display:inline-block;}

  /* desktop / wide layout */
  @media (min-width:860px){
    .room-body{flex-direction:row;}
    .video-col{flex:1 1 62%; flex-shrink:1;}
    .panels-outer{flex:1 1 38%; display:flex; flex-direction:column; min-width:320px; border-left:1px solid var(--border); min-height:0;}
    .tabbar{border-left:1px solid var(--border);}
    .video-wrap{aspect-ratio:16/9; max-height:calc(100dvh - 160px);}
  }
  @media (max-width:859px){
    .panels-outer{flex:1; display:flex; flex-direction:column; min-height:0;}
  }

  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:3px;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME SCREEN ============ -->
  <div id="screen-home" class="screen active">
    <div class="home-card">
      <div class="brand"><span class="glow"></span><h1>同時視聴ルーム</h1></div>
      <p class="brand-sub">YouTubeの動画をみんなで同時に見よう</p>

      <label for="input-username">ユーザーネーム</label>
      <input type="text" id="input-username" maxlength="20" placeholder="例：たろう">

      <label for="input-roomid">ルームID</label>
      <div class="row-inline">
        <input type="text" id="input-roomid" maxlength="30" placeholder="例：movie-night-01">
        <button class="btn btn-ghost btn-sm" id="btn-random-id" type="button">自動生成</button>
      </div>
      <p class="hint">好きなIDを決めて共有すれば、友達もそのIDで参加できます。</p>

      <div class="actions">
        <button class="btn btn-accent btn-block" id="btn-create-room">ルームを作成する</button>
        <button class="btn btn-ghost btn-block" id="btn-join-room">既存のルームに参加する</button>
      </div>
      <p class="error-msg" id="home-error"></p>
    </div>
  </div>

  <!-- ============ ROOM SCREEN ============ -->
  <div id="screen-room" class="screen">
    <div class="room-header">
      <div class="room-title">
        <div class="rid" id="room-title-id">-</div>
        <div class="sub" id="room-title-sub">接続中...</div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btn-leave">退出</button>
      <button class="icon-btn danger" id="btn-delete-room">ルーム全削除</button>
    </div>

    <div class="participants" id="participants"></div>

    <div class="room-body">
      <div class="video-col">
        <div class="video-wrap">
          <div id="player"></div>
          <div class="video-empty" id="video-empty">
            まだ動画がセットされていません<br>下のURL欄にYouTubeのリンクを貼って読み込んでください
          </div>
        </div>
        <div class="load-row">
          <input type="text" id="input-video-url" placeholder="YouTubeのURLを貼り付け">
          <button class="btn btn-accent btn-sm" id="btn-load-video">読込</button>
          <button class="btn btn-ghost btn-sm" id="btn-resync">同期</button>
        </div>
      </div>

      <div class="panels-outer">
        <div class="tabbar">
          <div class="tab active" data-tab="chat">チャット</div>
          <div class="tab" data-tab="comments">コメント欄</div>
        </div>
        <div class="panels">
          <div class="panel active" id="panel-chat">
            <div id="chat-messages"></div>
            <div class="chat-input-row">
              <input type="text" id="input-chat" maxlength="500" placeholder="メッセージを入力">
              <button class="btn btn-accent btn-sm" id="btn-send-chat">送信</button>
            </div>
          </div>
          <div class="panel" id="panel-comments">
            <p>YouTubeのコメント欄は仕様上このアプリ内に直接埋め込むことができません。<br>下のボタンからYouTube側でその動画を開くと、コメントを見ることができます。</p>
            <a class="btn btn-ghost" id="link-open-youtube" href="#" target="_blank" rel="noopener">YouTubeでコメントを見る</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
(function(){
  "use strict";

  /* ---------------- Firebase init ---------------- */
  const firebaseConfig = {
    apiKey: "AIzaSyCGkbyKm-ThFB-dA5aeFBAPmwB7aGE0bCE",
    authDomain: "kmtpj-a8f92.firebaseapp.com",
    databaseURL: "https://kmtpj-a8f92-default-rtdb.firebaseio.com",
    projectId: "kmtpj-a8f92",
    storageBucket: "kmtpj-a8f92.firebasestorage.app",
    messagingSenderId: "79749146454",
    appId: "1:79749146454:web:86c5f7cceb3f0b684858f7",
    measurementId: "G-C13R4G84QW"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  /* ---------------- State ---------------- */
  let uid = null;
  let userName = "";
  let roomId = "";
  let roomRef = null;
  let player = null;
  let playerReady = false;
  let pendingVideoId = null;
  let isRemoteUpdate = false;
  let lastKnownVideoId = null;
  let listenersAttached = false;

  const $ = (sel) => document.querySelector(sel);
  const homeScreen = $("#screen-home");
  const roomScreen = $("#screen-room");

  /* ---------------- Auth ---------------- */
  let authFailed = false;
  auth.signInAnonymously().catch(err=>{
    authFailed = true;
    $("#home-error").textContent = "認証エラー: " + err.message +
      "（Firebase Console → Authentication → Sign-in method で「匿名」を有効にしてください）";
    console.error("signInAnonymously failed:", err);
  });
  auth.onAuthStateChanged(user=>{
    if(user){ uid = user.uid; }
  });

  /* ---------------- Home screen logic ---------------- */
  const savedName = localStorage.getItem("wt_username");
  if(savedName) $("#input-username").value = savedName;

  $("#btn-random-id").addEventListener("click", ()=>{
    const id = "room-" + Math.random().toString(36).slice(2,8);
    $("#input-roomid").value = id;
  });

  function readHomeInputs(){
    const name = $("#input-username").value.trim();
    const rid = $("#input-roomid").value.trim();
    $("#home-error").textContent = "";
    if(!name){ $("#home-error").textContent = "ユーザーネームを入力してください"; return null; }
    if(!rid){ $("#home-error").textContent = "ルームIDを入力してください"; return null; }
    if(!/^[a-zA-Z0-9_\-ぁ-んァ-ヶ一-龠ー]{1,30}$/.test(rid)){
      $("#home-error").textContent = "ルームIDに使えない文字が含まれています";
      return null;
    }
    return {name, rid};
  }

  $("#btn-create-room").addEventListener("click", async ()=>{
    const vals = readHomeInputs();
    if(!vals) return;
    const btn = $("#btn-create-room");
    btn.disabled = true; const orig = btn.textContent; btn.textContent = "作成中...";
    try{
      await ensureAuth();
      const ref = db.ref("rooms/" + vals.rid);
      const snap = await ref.once("value");
      if(snap.exists()){
        $("#home-error").textContent = "そのルームIDは既に使われています。参加するには「既存のルームに参加する」を押してください。";
        return;
      }
      await ref.set({
        creatorUid: uid,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
      enterRoom(vals.name, vals.rid);
    }catch(err){
      $("#home-error").textContent = "作成に失敗しました: " + err.message;
      console.error("create room failed:", err);
    }finally{
      btn.disabled = false; btn.textContent = orig;
    }
  });

  $("#btn-join-room").addEventListener("click", async ()=>{
    const vals = readHomeInputs();
    if(!vals) return;
    const btn = $("#btn-join-room");
    btn.disabled = true; const orig = btn.textContent; btn.textContent = "参加中...";
    try{
      await ensureAuth();
      const ref = db.ref("rooms/" + vals.rid);
      const snap = await ref.once("value");
      if(!snap.exists()){
        $("#home-error").textContent = "そのルームIDは見つかりませんでした。";
        return;
      }
      enterRoom(vals.name, vals.rid);
    }catch(err){
      $("#home-error").textContent = "参加に失敗しました: " + err.message;
      console.error("join room failed:", err);
    }finally{
      btn.disabled = false; btn.textContent = orig;
    }
  });

  function ensureAuth(){
    return new Promise((resolve, reject)=>{
      if(uid){ resolve(); return; }
      if(authFailed){ reject(new Error("認証に失敗しています。Firebase Consoleで匿名認証を有効にしてから再読み込みしてください。")); return; }
      const timeout = setTimeout(()=>{
        unsub();
        reject(new Error("認証がタイムアウトしました。ネットワーク接続とFirebaseの匿名認証設定を確認してください。"));
      }, 8000);
      const unsub = auth.onAuthStateChanged(user=>{
        if(user){ clearTimeout(timeout); uid = user.uid; unsub(); resolve(); }
      });
    });
  }

  /* ---------------- Enter / leave room ---------------- */
  function enterRoom(name, rid){
    userName = name;
    roomId = rid;
    localStorage.setItem("wt_username", name);
    roomRef = db.ref("rooms/" + rid);

    homeScreen.classList.remove("active");
    roomScreen.classList.add("active");
    $("#room-title-id").textContent = rid;
    $("#room-title-sub").textContent = "接続中...";

    // presence
    const userRef = roomRef.child("users/" + uid);
    userRef.set({ name: userName, joinedAt: firebase.database.ServerValue.TIMESTAMP });
    userRef.onDisconnect().remove();

    attachRoomListeners();
    postSystemMessageLocalOnly(userName + " さんが入室しました");
  }

  function leaveRoom(goingHome){
    if(roomRef && uid){
      roomRef.child("users/" + uid).remove();
    }
    detachRoomListeners();
    roomScreen.classList.remove("active");
    homeScreen.classList.add("active");
    if(player && playerReady){ try{ player.stopVideo(); }catch(e){} }
    $("#video-empty").style.display = "flex";
    lastKnownVideoId = null;
    if(goingHome !== false){ $("#home-error").textContent = ""; }
  }

  $("#btn-leave").addEventListener("click", ()=> leaveRoom());

  $("#btn-delete-room").addEventListener("click", async ()=>{
    if(!confirm("このルームを完全に削除します。チャット・動画情報・参加者情報がすべて消えます。よろしいですか？")) return;
    try{
      await roomRef.remove();
      // remove() triggers the 'value' listener below for everyone including us
    }catch(err){
      alert("削除に失敗しました: " + err.message + "\n(作成者のみ削除できます)");
    }
  });

  /* ---------------- Firebase listeners ---------------- */
  let usersHandler, chatHandler, videoHandler, roomExistsHandler;

  function attachRoomListeners(){
    if(listenersAttached) return;
    listenersAttached = true;

    roomExistsHandler = roomRef.on("value", (snap)=>{
      if(!snap.exists()){
        alert("このルームは削除されました。");
        leaveRoom();
      }
    });

    usersHandler = roomRef.child("users").on("value", (snap)=>{
      renderParticipants(snap.val() || {});
    });

    chatHandler = roomRef.child("chat").limitToLast(200).on("value", (snap)=>{
      renderChat(snap.val() || {});
    });

    videoHandler = roomRef.child("video").on("value", (snap)=>{
      const data = snap.val();
      if(!data || !data.videoId) return;
      applyRemoteVideo(data);
    });
  }

  function detachRoomListeners(){
    if(!listenersAttached) return;
    listenersAttached = false;
    if(roomExistsHandler) roomRef.off("value", roomExistsHandler);
    if(usersHandler) roomRef.child("users").off("value", usersHandler);
    if(chatHandler) roomRef.child("chat").off("value", chatHandler);
    if(videoHandler) roomRef.child("video").off("value", videoHandler);
  }

  /* ---------------- Participants UI ---------------- */
  function renderParticipants(users){
    const wrap = $("#participants");
    wrap.innerHTML = "";
    const names = Object.values(users);
    $("#room-title-sub").textContent = names.length + "人が視聴中";
    names.forEach(u=>{
      const chip = document.createElement("div");
      chip.className = "chip";
      const initial = (u.name || "?").trim().charAt(0).toUpperCase();
      chip.innerHTML = '<span class="dot">' + escapeHtml(initial) + '</span><span>' + escapeHtml(u.name || "名無し") + '</span>';
      wrap.appendChild(chip);
    });
  }

  /* ---------------- Chat UI ---------------- */
  function renderChat(chatObj){
    const wrap = $("#chat-messages");
    const wasNearBottom = (wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight) < 80;
    wrap.innerHTML = "";
    const entries = Object.values(chatObj).sort((a,b)=> (a.time||0) - (b.time||0));
    entries.forEach(m=>{
      const div = document.createElement("div");
      div.className = "msg" + (m.uid === uid ? " me" : "");
      div.innerHTML = '<div class="name">' + escapeHtml(m.name || "名無し") + '</div><div class="text">' + escapeHtml(m.text || "") + '</div>';
      wrap.appendChild(div);
    });
    if(wasNearBottom || entries.length <= 1) wrap.scrollTop = wrap.scrollHeight;
  }

  function postSystemMessageLocalOnly(text){
    const wrap = $("#chat-messages");
    const div = document.createElement("div");
    div.className = "msg system";
    div.innerHTML = '<div class="text">' + escapeHtml(text) + '</div>';
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function sendChat(){
    const input = $("#input-chat");
    const text = input.value.trim();
    if(!text) return;
    roomRef.child("chat").push({
      uid: uid,
      name: userName,
      text: text,
      time: firebase.database.ServerValue.TIMESTAMP
    });
    input.value = "";
  }
  $("#btn-send-chat").addEventListener("click", sendChat);
  $("#input-chat").addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ e.preventDefault(); sendChat(); }
  });

  /* ---------------- Tabs ---------------- */
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
      tab.classList.add("active");
      $("#panel-" + tab.dataset.tab).classList.add("active");
    });
  });

  /* ---------------- YouTube video loading ---------------- */
  function extractVideoId(raw){
    if(!raw) return null;
    let str = raw.trim();

    // normalize full-width characters that mobile keyboards / clipboards sometimes insert
    str = str.replace(/[０-９Ａ-Ｚａ-ｚ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    str = str.replace(/？/g, "?").replace(/＝/g, "=").replace(/＆/g, "&").replace(/／/g, "/").replace(/：/g, ":");
    str = str.replace(/\s+/g, "");

    // pasted a bare video ID (no URL at all)
    if(/^[a-zA-Z0-9_-]{10,12}$/.test(str)) return str;

    const patterns = [
      /[?&]v=([a-zA-Z0-9_-]{6,15})/,     // watch?v=ID  (any subdomain: www./m./music.)
      /youtu\.be\/([a-zA-Z0-9_-]{6,15})/, // youtu.be/ID
      /\/embed\/([a-zA-Z0-9_-]{6,15})/,   // /embed/ID
      /\/shorts\/([a-zA-Z0-9_-]{6,15})/,  // /shorts/ID
      /\/live\/([a-zA-Z0-9_-]{6,15})/     // /live/ID
    ];
    for(const p of patterns){
      const m = str.match(p);
      if(m) return m[1];
    }
    return null;
  }

  $("#btn-load-video").addEventListener("click", ()=>{
    const url = $("#input-video-url").value.trim();
    const vid = extractVideoId(url);
    if(!vid){
      alert("YouTubeのURLとして認識できませんでした。");
      return;
    }
    roomRef.child("video").set({
      videoId: vid,
      state: {
        status: "paused",
        time: 0,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      }
    });
    $("#input-video-url").value = "";
  });

  $("#btn-resync").addEventListener("click", ()=>{
    roomRef.child("video").once("value").then(snap=>{
      const data = snap.val();
      if(data && data.videoId) applyRemoteVideo(data, true);
    });
  });

  function applyRemoteVideo(data, force){
    $("#video-empty").style.display = "none";
    $("#link-open-youtube").href = "https://www.youtube.com/watch?v=" + data.videoId;

    if(!playerReady){
      pendingVideoId = data;
      return;
    }

    if(lastKnownVideoId !== data.videoId){
      lastKnownVideoId = data.videoId;
      isRemoteUpdate = true;
      player.loadVideoById(data.videoId);
      applyState(data.state);
      setTimeout(()=>{ isRemoteUpdate = false; }, 1200);
      return;
    }

    applyState(data.state, force);
  }

  function applyState(state, force){
    if(!state || !playerReady) return;
    const now = Date.now();
    const elapsed = state.updatedAt ? (now - state.updatedAt) / 1000 : 0;
    const target = state.status === "playing" ? state.time + Math.max(elapsed, 0) : state.time;

    let current = 0;
    try{ current = player.getCurrentTime() || 0; }catch(e){}

    isRemoteUpdate = true;
    if(force || Math.abs(current - target) > 1.5){
      player.seekTo(target, true);
    }
    if(state.status === "playing"){
      player.playVideo();
    } else {
      player.pauseVideo();
    }
    setTimeout(()=>{ isRemoteUpdate = false; }, 900);
  }

  function pushLocalState(status){
    if(!roomRef || isRemoteUpdate) return;
    let time = 0;
    try{ time = player.getCurrentTime() || 0; }catch(e){}
    roomRef.child("video/state").set({
      status: status,
      time: time,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  }

  /* ---------------- YouTube IFrame API callbacks ---------------- */
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player("player", {
      height: "100%",
      width: "100%",
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: ()=>{
          playerReady = true;
          if(pendingVideoId){
            applyRemoteVideo(pendingVideoId);
            pendingVideoId = null;
          }
        },
        onStateChange: (e)=>{
          if(isRemoteUpdate) return;
          if(e.data === YT.PlayerState.PLAYING) pushLocalState("playing");
          else if(e.data === YT.PlayerState.PAUSED) pushLocalState("paused");
        }
      }
    });
  };

  /* ---------------- utils ---------------- */
  function escapeHtml(str){
    return String(str)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

})();
</script>
