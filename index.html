<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>そっくり描きゲーム</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--card:#fff;--tx:#222;--ac:#e8590c;--mu:#888;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#2a2a2d;--tx:#eee;--bd:#444}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;padding:12px}
#app{max-width:460px;margin:0 auto}
h1{font-size:1.3rem;text-align:center;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;padding:11px;font-size:1rem;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--bg);color:var(--tx)}
button{width:100%;padding:12px;font-size:1rem;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;margin-top:6px}
button.sec{background:#495057}
button:disabled{opacity:.4}
canvas{width:100%;aspect-ratio:1;background:#fff;border:2px solid var(--bd);border-radius:10px;touch-action:none;display:block}
img.pic{width:100%;border:2px solid var(--bd);border-radius:10px;background:#fff;display:block}
.tb{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.cl{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0;margin:0}
.cl.on{border-color:var(--ac)}
.tb input[type=range]{flex:1;margin:0;padding:0;min-width:80px}
.tb .clr{width:auto;padding:6px 10px;margin:0;font-size:.85rem}
.code{font-size:2.4rem;letter-spacing:.3em;text-align:center;font-weight:800}
.mu{color:var(--mu);font-size:.9rem;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:3px solid transparent;border-radius:12px;padding:4px;background:var(--bg)}
.opt.me{opacity:.45}
.opt.vt{border-color:var(--ac)}
.opt small{display:block;text-align:center;padding:4px 0}
.win{border-color:#f4b400}
ul{padding-left:1.2em;margin:6px 0}
#err{color:#e03131;text-align:center;min-height:1.2em;margin:6px 0 0}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBqDRgzhHOvUcUoV_JHm9zFJ1IS_CA0394",
  authDomain: "jumyou.firebaseapp.com",
  databaseURL: "https://jumyou-default-rtdb.firebaseio.com",
  projectId: "jumyou",
  storageBucket: "jumyou.firebasestorage.app",
  messagingSenderId: "441346887929",
  appId: "1:441346887929:web:0ca3115f8d1f806df49228",
  measurementId: "G-FBZF2NHEC9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = (() => {
  try { let v = localStorage.getItem('uid'); if (!v) { v = Math.random().toString(36).slice(2, 10); localStorage.setItem('uid', v); } return v; }
  catch (e) { return Math.random().toString(36).slice(2, 10); }
})();
let name = '', code = '', room = null, rref = null, lastKey = '';
let color = '#000000', size = 6;
const COPY_SEC = 60;

/* ---------- ホーム ---------- */
function home() {
  lastKey = '';
  app.innerHTML = `<h1>🎨 そっくり描きゲーム</h1><div class="card">
    <input id="nm" maxlength="10" placeholder="あなたの名前" value="${esc(name)}">
    <button id="mk">ルームを作る</button><hr style="border:0;border-top:1px solid var(--bd);margin:14px 0">
    <input id="cd" inputmode="numeric" maxlength="4" placeholder="ルーム番号（4桁）">
    <button id="jn" class="sec">参加する</button><p id="err"></p></div>`;
  const err = m => $('#err').textContent = m;
  $('#mk').onclick = async () => {
    name = $('#nm').value.trim(); if (!name) return err('名前を入力してね');
    const c = String(Math.floor(1000 + Math.random() * 9000));
    try { await db.ref('rooms/' + c).set({ host: uid, state: 'lobby', round: 1, created: Date.now() }); enter(c); }
    catch (e) { err('作成失敗：DBのルールを確認してね'); }
  };
  $('#jn').onclick = async () => {
    name = $('#nm').value.trim(); const c = $('#cd').value.trim();
    if (!name) return err('名前を入力してね');
    try {
      const s = await db.ref('rooms/' + c).get();
      if (!s.exists()) return err('そのルームは見つかりません');
      enter(c);
    } catch (e) { err('参加失敗：DBのルールを確認してね'); }
  };
}

function enter(c) {
  code = c; rref = db.ref('rooms/' + c);
  const p = rref.child('players/' + uid);
  p.set({ name }); p.onDisconnect().remove();
  rref.on('value', s => { room = s.val(); view(); });
}

/* ---------- お絵かき ---------- */
function toolbar() {
  const cs = ['#000000', '#e03131', '#1971c2', '#2f9e44', '#f08c00', '#ffffff'];
  return `<div class="tb">${cs.map(c => `<button class="cl ${c === color ? 'on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('')}
  <input type="range" id="sz" min="2" max="30" value="${size}"><button class="clr sec" id="clr">全消し</button></div>`;
}
function pad() {
  const cv = $('#cv'), x = cv.getContext('2d');
  cv.width = cv.height = 400;
  const wipe = () => { x.fillStyle = '#fff'; x.fillRect(0, 0, 400, 400); x.lineCap = x.lineJoin = 'round'; };
  wipe();
  let down = false, l;
  const P = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 400 / r.width, (e.clientY - r.top) * 400 / r.height]; };
  const seg = (a, b) => { x.strokeStyle = color; x.lineWidth = size; x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); };
  cv.onpointerdown = e => { down = true; l = P(e); cv.setPointerCapture(e.pointerId); seg(l, l); };
  cv.onpointermove = e => { if (!down) return; const p = P(e); seg(l, p); l = p; };
  cv.onpointerup = cv.onpointercancel = () => down = false;
  document.querySelectorAll('.cl').forEach(b => b.onclick = () => {
    color = b.dataset.c; document.querySelectorAll('.cl').forEach(o => o.classList.toggle('on', o === b));
  });
  $('#sz').oninput = e => size = +e.target.value;
  $('#clr').onclick = wipe;
  return () => cv.toDataURL('image/jpeg', 0.6);
}

/* ---------- 画面 ---------- */
function view() {
  if (!room) { home(); return; }
  const ps = room.players || {}, ids = Object.keys(ps), st = room.state;
  const host = room.host === uid, dr = room.drawer === uid;
  const cp = room.copies || {}, vt = room.votes || {};
  const sub = st === 'copy' ? !!cp[uid] : st === 'vote' ? !!vt[uid] : false;
  const key = [st, room.round, room.drawer, ids.join(), sub].join('|');
  if (key !== lastKey) {
    lastKey = key;
    const list = `<ul>${ids.map(i => `<li>${esc(ps[i].name)}${i === room.host ? ' 👑' : ''}${i === room.drawer ? ' ✏️' : ''}</li>`).join('')}</ul>`;
    const head = `<h1>ルーム ${code}　第${room.round}回</h1>`;
    if (st === 'lobby') {
      app.innerHTML = `${head}<div class="card"><div class="code">${code}</div><p class="mu">この番号を友達に教えてね</p>${list}
        ${host ? `<button id="go" ${ids.length < 3 ? 'disabled' : ''}>ゲーム開始（3人以上）</button>` : '<p class="mu">ホストの開始を待っています…</p>'}</div>`;
      if (host) $('#go').onclick = () => {
        const d = ids.filter(i => i !== room.prevDrawer); const pick = d[Math.floor(Math.random() * d.length)] || ids[0];
        rref.update({ state: 'draw', drawer: pick, original: null, copies: null, votes: null });
      };
    } else if (st === 'draw') {
      if (dr) {
        app.innerHTML = `${head}<div class="card"><p><b>あなたが出題者！</b> お題は自由。みんなが真似できる絵を描いてね</p>${toolbar()}<canvas id="cv"></canvas><button id="ok">完成！</button></div>`;
        const get = pad();
        $('#ok').onclick = () => rref.update({ original: get(), state: 'copy', copyEnd: Date.now() + COPY_SEC * 1000 });
      } else {
        app.innerHTML = `${head}<div class="card"><p class="mu">✏️ ${esc((ps[room.drawer] || {}).name || '出題者')} さんが絵を描いています…</p></div>`;
      }
    } else if (st === 'copy') {
      if (dr) app.innerHTML = `${head}<div class="card"><p class="mu">みんなが真似して描いています</p><p class="mu" id="st"></p><img class="pic" src="${room.original}"></div>`;
      else if (sub) app.innerHTML = `${head}<div class="card"><p class="mu">提出しました！他の人を待っています</p><p class="mu" id="st"></p></div>`;
      else {
        app.innerHTML = `${head}<div class="card"><p class="mu" id="st"></p><p><b>お手本</b></p><img class="pic" src="${room.original}"><p><b>あなたの絵</b></p>${toolbar()}<canvas id="cv"></canvas><button id="ok">提出する</button></div>`;
        const get = pad();
        $('#ok').onclick = () => rref.child('copies/' + uid).set({ img: get(), name });
      }
    } else if (st === 'vote') {
      const cands = Object.keys(cp);
      app.innerHTML = `${head}<div class="card"><p><b>お手本</b></p><img class="pic" src="${room.original}"></div>
        <div class="card"><p>一番似ていると思う絵を選んでね（自分以外）</p><p class="mu" id="st"></p><div class="grid">
        ${cands.map(c => `<div class="opt ${c === uid ? 'me' : ''} ${vt[uid] === c ? 'vt' : ''}" data-id="${c}"><img class="pic" src="${cp[c].img}"><small>${esc(cp[c].name)}</small></div>`).join('')}</div>
        ${host ? '<button id="fin" class="sec">投票を締め切る</button>' : ''}</div>`;
      document.querySelectorAll('.opt').forEach(o => o.onclick = () => { if (o.dataset.id !== uid) rref.child('votes/' + uid).set(o.dataset.id); });
      if (host) $('#fin').onclick = () => rref.update({ state: 'result' });
    } else if (st === 'result') {
      const cands = Object.keys(cp), tally = {};
      cands.forEach(c => tally[c] = 0); Object.values(vt).forEach(v => { if (v in tally) tally[v]++; });
      const sorted = cands.sort((a, b) => tally[b] - tally[a]), top = sorted.length ? tally[sorted[0]] : 0;
      app.innerHTML = `${head}<div class="card"><p><b>お手本</b>（${esc((ps[room.drawer] || {}).name || '')}）</p><img class="pic" src="${room.original}"></div>
        <div class="card"><h3 style="margin-top:0">🏆 結果</h3><div class="grid">
        ${sorted.map(c => `<div class="opt ${tally[c] === top && top > 0 ? 'win' : ''}"><img class="pic" src="${cp[c].img}"><small>${tally[c] === top && top > 0 ? '👑 ' : ''}${esc(cp[c].name)}：${tally[c]}票</small></div>`).join('') || '<p class="mu">提出がありませんでした</p>'}</div>
        ${host ? '<button id="again">もう一回</button>' : '<p class="mu">ホストが次を始めるのを待っています</p>'}</div>`;
      if (host) $('#again').onclick = () => rref.update({ state: 'lobby', round: room.round + 1, prevDrawer: room.drawer, drawer: null, original: null, copies: null, votes: null });
    }
  }
  tick();
}

function tick() {
  if (!room) return;
  const ps = room.players || {}, ids = Object.keys(ps), host = room.host === uid, st = room.state;
  const cp = room.copies || {}, vt = room.votes || {}, s = $('#st');
  if (st === 'copy') {
    const copiers = ids.filter(i => i !== room.drawer), left = Math.max(0, Math.ceil(((room.copyEnd || 0) - Date.now()) / 1000));
    if (s) s.textContent = `残り ${left} 秒　提出 ${copiers.filter(i => cp[i]).length}/${copiers.length}`;
    if (host && (left <= 0 || copiers.every(i => cp[i]))) rref.update({ state: Object.keys(cp).length ? 'vote' : 'result' });
  } else if (st === 'vote') {
    const cands = Object.keys(cp), eligible = ids.filter(i => cands.some(c => c !== i));
    if (s) s.textContent = `投票 ${eligible.filter(i => vt[i]).length}/${eligible.length}`;
    if (host && eligible.every(i => vt[i])) rref.update({ state: 'result' });
  }
}
setInterval(tick, 1000);
home();
</script>
</body>
</html>
