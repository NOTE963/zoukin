<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白紙カードバトル オンライン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap">
<style>
:root{--bg:#e9eeff;--fg:#1d2340;--card:#fff;--line:#b9c3ee;--acc:#5b3df5;--atk:#e5484d;--hp:#1f9d6b;--en:#f5b800;--mut:#5d668f;--gold:#c8930a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141830;--fg:#eef0ff;--card:#1f2547;--line:#3b4478;--mut:#9aa3d6}}
:root[data-theme="dark"]{--bg:#141830;--fg:#eef0ff;--card:#1f2547;--line:#3b4478;--mut:#9aa3d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.5 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
#app{max-width:460px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:900;margin:4px 0 12px}
.card{background:var(--card);border:3px solid var(--fg);border-radius:18px;padding:10px;box-shadow:4px 4px 0 var(--fg)}
.card canvas,.card img{display:block;width:100%;aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none}
input[type=text],input:not([type]){width:100%;margin-top:8px;font:inherit;font-weight:900;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button{font:inherit;font-weight:900;color:var(--fg);background:var(--card);border:2px solid var(--fg);border-radius:12px;padding:8px 12px;cursor:pointer}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{width:100%;background:var(--acc);color:#fff;border-color:var(--fg);padding:12px;font-size:18px;box-shadow:3px 3px 0 var(--fg)}
.sw{width:34px;height:34px;padding:0;border-radius:50%}
.sw.on{outline:3px solid var(--acc);outline-offset:2px}
.tp{width:56px;height:56px;padding:0;border-radius:14px;font-size:26px}
.tp.on{outline:3px solid var(--acc);outline-offset:2px}
.mv{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.slots{display:flex;gap:6px;min-height:34px;align-items:center;margin:8px 0;flex-wrap:wrap}
.pip{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;padding:0;border:2px solid var(--fg)}
.pip.A{background:var(--atk)}.pip.H{background:var(--hp)}.pip.E{background:var(--en);color:#000;border:none}
small,em{color:var(--mut)}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;border:2px solid var(--fg)}
.bar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.bar.e i{background:var(--atk)}
.fight{display:grid;gap:12px}
.foe{text-align:center}
.foe .em{font-size:64px;line-height:1.1}
.me{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.me img{width:110px;height:110px;border:2px solid var(--line);border-radius:10px;background:#fff}
.log{min-height:76px;font-size:14px;color:var(--mut);margin:0;padding-left:18px}
.log li:last-child{color:var(--fg);font-weight:900}
.acts{display:grid;gap:8px}
.acts button{text-align:left;display:flex;justify-content:space-between;gap:8px}
.dead img{filter:grayscale(1) brightness(.7)}
.center{text-align:center}
.coin{color:var(--gold);font-weight:900}
.rank{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.rank li{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 10px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
// ==== Firebase (オンラインのランキング機能用) ====
const firebaseConfig = {
  apiKey: "AIzaSyDwb4Em9xu793O7uU6y17uKQ4-2iAbtEPg",
  authDomain: "omg-haikyo.firebaseapp.com",
  projectId: "omg-haikyo",
  storageBucket: "omg-haikyo.firebasestorage.app",
  messagingSenderId: "1074436554728",
  appId: "1:1074436554728:web:2908580e1ad2a4623fee5d",
  measurementId: "G-MXKFYVHJS7"
};
let fbReady=false,db=null;
try{
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  firebase.auth().signInAnonymously().then(()=>fbReady=true).catch(()=>fbReady=false);
}catch(e){fbReady=false}

const app=document.getElementById('app'),$=s=>document.querySelector(s);
const KEY='blankcard-v5';
const TYPES={F:{n:'ほのお',e:'🔥',beats:'G'},W:{n:'みず',e:'💧',beats:'F'},G:{n:'くさ',e:'🌿',beats:'W'}};
const FOES=[['ムシ','🐛','G'],['ゴブリン','👺','F'],['コウモリ','🦇','W'],['オバケ','👻','G'],['ロボ','🤖','F'],['オオカミ','🐺','W'],['タコ','🐙','W'],['ドクロ','💀','G'],['ドラゴン','🐉','F'],['デーモン','😈','F']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let G=null,B=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}}
const cnt=(m,t)=>m.pts.filter(s=>s===t).length;
const dmgOf=m=>Math.round(10*cnt(m,'A')*(1+.5*(m.pts.length-1)));
const hpOf=()=>50+10*cnt(G.move,'H');
const growth=()=>G.max*20+dmgOf(G.move)*2+(hpOf()-50)+G.wins*15;
const adv=(atkT,defT)=>TYPES[atkT].beats===defT?1.5:(TYPES[defT].beats===atkT?0.67:1);

function title(){
  app.innerHTML=`<h1>白紙カードバトル</h1><div class="card"><img src="${G.img}" alt=""><h2 class="center" style="margin:8px 0 0">${esc(G.name)} <small>${TYPES[G.type].e}${TYPES[G.type].n}</small></h2><p class="center" style="margin:0"><small>撃破 ${G.wins} ／ 技のエネルギー最大 ${G.max} ／ <span class="coin">🪙${G.coins}</span></small></p><p class="center" style="margin:4px 0 0"><small>育成度 <b>${growth()}</b></small></p></div>
  <div class="row"><button class="big" id="cont">つづきから</button></div>
  <div class="row"><button id="shop" style="flex:1">ショップ</button><button id="rank" style="flex:1">ランキング</button></div>
  <button id="new" style="width:100%">新しいカードで最初から(このカードは消える)</button>`;
  $('#cont').onclick=moves;$('#shop').onclick=shop;$('#rank').onclick=()=>ranking(title);
  $('#new').onclick=()=>{if(confirm('このカードを失います。よろしいですか?')){wipe();G=null;draw()}};
}

function draw(){
  const cols=['#1d2340','#e5484d','#f5813a','#f5b800','#1f9d6b','#2f7df6','#8a4bd6','#ffffff'];
  app.innerHTML=`<h1>カードに絵を描こう</h1><div class="card"><canvas id="cv" width="300" height="300"></canvas><input id="nm" maxlength="12" placeholder="カードの名前"></div>
  <div class="row" id="cols">${cols.map((c,i)=>`<button class="sw${i?'':' on'}" data-c="${c}" style="background:${c}" aria-label="色${i+1}"></button>`).join('')}</div>
  <div class="row"><label>太さ <input type="range" id="sz" min="2" max="30" value="6" style="width:auto"></label><button id="cl">全部消す</button></div>
  <p style="margin:4px 0"><b>タイプを選ぶ</b></p>
  <div class="row" id="tps">${Object.entries(TYPES).map(([k,v],i)=>`<button class="tp${i?'':' on'}" data-t="${k}">${v.e}</button>`).join('')}</div>
  <button class="big" id="go">技を決める</button>`;
  const cv=$('#cv'),c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,300,300);c.lineCap=c.lineJoin='round';
  let col=cols[0],dr=false,lx=0,ly=0,type='F';
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height]};
  const stroke=(x,y)=>{c.strokeStyle=col;c.lineWidth=$('#sz').value;c.beginPath();c.moveTo(lx,ly);c.lineTo(x,y+.01);c.stroke();lx=x;ly=y};
  cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);[lx,ly]=pos(e);stroke(lx,ly)};
  cv.onpointermove=e=>{if(dr){const[x,y]=pos(e);stroke(x,y)}};
  cv.onpointerup=cv.onpointercancel=()=>dr=false;
  $('#cols').onclick=e=>{const b=e.target.closest('.sw');if(!b)return;col=b.dataset.c;document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===b))};
  $('#tps').onclick=e=>{const b=e.target.closest('.tp');if(!b)return;type=b.dataset.t;document.querySelectorAll('.tp').forEach(s=>s.classList.toggle('on',s===b))};
  $('#cl').onclick=()=>{c.fillStyle='#fff';c.fillRect(0,0,300,300)};
  $('#go').onclick=()=>{
    const name=$('#nm').value.trim();
    if(!name){$('#nm').focus();return}
    G={name,img:cv.toDataURL('image/png'),type,max:2,wins:0,coins:0,shield:0,move:{name:'',pts:['A']}};
    save();moves();
  };
}

function moves(){
  const m=G.move;
  app.innerHTML=`<h1>${esc(G.name)}の技</h1><p style="margin:0"><small>技は1つ。必要エネルギーを最大 <b>${G.max}</b> まで増やせます。エネルギー1個ごとに「ダメージ+10」か「HP+10」を選びます。エネルギーが多い技ほど大技ボーナスが付きます。</small></p>
  <div class="mv"><input id="mn" maxlength="10" placeholder="技の名前" value="${esc(m.name)}"><div class="slots" id="s"></div>
  <div class="row" style="margin:0"><button id="up">＋エネルギーを増やす</button><button id="dn">ー減らす</button></div><p style="margin:8px 0 0" id="t"></p></div>
  <button class="big" id="go">バトル開始</button>${nav()}`;
  const paint=()=>{
    $('#s').innerHTML=m.pts.map((t,j)=>`<button class="pip ${t}" data-j="${j}" aria-label="${t==='A'?'ダメージ+10':'HP+10'}">${t==='A'?'⚔':'♥'}</button>`).join('');
    $('#t').innerHTML=`必要エネルギー <b>${m.pts.length}</b> ／ ダメージ <b>${dmgOf(m)}</b> ／ カードのHP <b>${hpOf()}</b>`;
    $('#up').disabled=m.pts.length>=G.max;$('#dn').disabled=m.pts.length<=1;
  };
  paint();
  app.oninput=e=>{if(e.target.id==='mn')m.name=e.target.value};
  app.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='navHome'){app.oninput=app.onclick=null;title();return}
    if(b.dataset.j!==undefined){const j=+b.dataset.j;m.pts[j]=m.pts[j]==='A'?'H':'A';paint()}
    else if(b.id==='up'){if(m.pts.length<G.max){m.pts.push('A');paint()}}
    else if(b.id==='dn'){if(m.pts.length>1){m.pts.pop();paint()}}
    else if(b.id==='go'){
      if(!cnt(m,'A')){alert('ダメージ+10を最低1つ選んでください');return}
      if(!m.name.trim())m.name='ひっさつ';
      app.oninput=app.onclick=null;save();battle();
    }
  };
}

function nav(){return `<div class="row" style="margin-top:14px"><button id="navHome" style="width:100%">🏠 ホーム</button></div>`;}
function shop(){
  const items=[
    {id:'heal',n:'回復薬',d:'次のバトル開始時、HP全回復',cost:15},
    {id:'shield',n:'シールド',d:'次のバトルで1回だけ攻撃を防ぐ',cost:20},
  ];
  app.innerHTML=`<h1>ショップ <span class="coin">🪙${G.coins}</span></h1>${items.map(it=>`<div class="mv row" style="justify-content:space-between"><div><b>${it.n}</b><br><small>${it.d}</small></div><button data-i="${it.id}" data-c="${it.cost}" ${G.coins<it.cost?'disabled':''}>🪙${it.cost} 購入</button></div>`).join('')}
  <p><small>所持シールド: ${G.shield}</small></p>${nav()}`;
  app.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='navHome'){title();return}
    if(!b.dataset.i)return;
    const cost=+b.dataset.c;if(G.coins<cost)return;
    G.coins-=cost;
    if(b.dataset.i==='shield')G.shield++;
    else if(b.dataset.i==='heal')G.potion=(G.potion||0)+1;
    save();shop();
  };
}

async function ranking(back){
  app.innerHTML=`<h1>ランキング(育成度)</h1><p><small>接続中...</small></p><button class="big" id="back">もどる</button>`;
  $('#back').onclick=back;
  if(!db){$('p',app).innerHTML='<small>オンライン機能に接続できませんでした。</small>';return}
  try{
    const snap=await db.collection('cards').orderBy('power','desc').limit(10).get();
    const rows=[];snap.forEach(d=>rows.push(d.data()));
    app.innerHTML=`<h1>ランキング(育成度)</h1><ul class="rank">${rows.map((r,i)=>`<li><span>${i+1}. ${TYPES[r.type]?TYPES[r.type].e:''}${esc(r.name||'?')}</span><span>育成度 ${r.power||0}</span></li>`).join('')||'<li>まだ記録がありません</li>'}</ul><button class="big" id="back">もどる</button>`;
    $('#back').onclick=back;
  }catch(e){app.innerHTML=`<h1>ランキング</h1><p><small>読み込みに失敗しました。</small></p><button class="big" id="back">もどる</button>`;$('#back').onclick=back;}
}
function submitScore(){
  if(!db||!fbReady)return;
  db.collection('cards').add({name:G.name,type:G.type,wins:G.wins,power:growth(),ts:Date.now()}).catch(()=>{});
}

function battle(){
  const n=G.wins+1,f=FOES[(n-1)%FOES.length],hp=30+10*n,cost=1+Math.floor((n-1)/3),dmg=cost*(10+5*(n-1));
  let ph=hpOf();
  if(G.potion){ph=Math.max(ph,ph);G.potion--}
  B={n,busy:false,log:[`Lv.${n} ${f[0]}(${TYPES[f[2]].e}) があらわれた!`],e:{name:f[0],em:f[1],type:f[2],hp,max:hp,en:0,cost,dmg},p:{hp:ph,max:ph,en:1,shield:G.shield>0}};
  if(B.p.shield)G.shield--;
  save();show();
}
function show(){
  const {e,p}=B,m=G.move,k=m.pts.length;
  app.innerHTML=`<div class="fight">
  <div class="card foe"><div class="em">${e.em}</div><b>Lv.${B.n} ${e.name} ${TYPES[e.type].e}</b>
    <div class="bar e" style="margin:6px 0"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div>
    <small>HP ${Math.max(0,e.hp)} ／ エネルギー ${e.en}/${e.cost} ／ 技: ${e.dmg}ダメージ</small></div>
  <ul class="log">${B.log.slice(-4).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
  <div class="card me"><img src="${G.img}" alt=""><div><b>${esc(G.name)} ${TYPES[G.type].e}</b>${p.shield?' 🛡':''}
    <div class="bar" style="margin:6px 0"><i style="width:${Math.max(0,p.hp/p.max*100)}%"></i></div><small>HP ${p.hp}/${p.max}</small>
    <div class="slots" style="margin:6px 0 0">${Array.from({length:k},(_,i)=>`<span class="pip E" style="width:20px;height:20px;opacity:${i<p.en?1:.25}"></span>`).join('')}</div></div></div>
  <div class="acts"><button id="atk" ${B.busy||p.en<k?'disabled':''}><span>${esc(m.name)}</span><span>⚡${k} ／ ⚔${Math.round(dmgOf(m)*adv(G.type,e.type))}</span></button>
  <button id="pass" ${B.busy?'disabled':''}>パス(エネルギーをためる)</button></div></div>`;
  app.onclick=ev=>{
    if(B.busy)return;
    const b=ev.target.closest('button');if(!b)return;
    if(b.id==='pass'){B.log.push('パスした');endTurn();return}
    if(b.id==='atk'&&B.p.en>=k){
      B.p.en-=k;const d=Math.round(dmgOf(m)*adv(G.type,e.type));B.e.hp-=d;
      B.log.push(`${G.name}の「${m.name}」! ${d}ダメージ${adv(G.type,e.type)>1?'(効果ばつぐん!)':adv(G.type,e.type)<1?'(いまひとつ)':''}`);endTurn();
    }
  };
}
function endTurn(){
  if(B.e.hp<=0){B.busy=true;show();return setTimeout(win,700)}
  B.busy=true;show();
  setTimeout(()=>{
    const e=B.e;e.en++;
    if(e.en>=e.cost){
      e.en-=e.cost;
      const d=Math.round(e.dmg*adv(e.type,G.type));
      if(B.p.shield){B.p.shield=false;B.log.push(`${e.name}の攻撃をシールドで防いだ!`)}
      else{B.p.hp-=d;B.log.push(`${e.name}の攻撃! ${d}ダメージ`)}
    }else B.log.push(`${e.name}はエネルギーをためている`);
    if(B.p.hp<=0){B.p.hp=0;show();return setTimeout(lose,700)}
    B.p.en=Math.min(G.move.pts.length,B.p.en+1);B.busy=false;show();
  },650);
}
function win(){
  G.wins++;G.max++;G.coins+=10*B.n;save();submitScore();
  app.onclick=null;
  app.innerHTML=`<h1 class="center">勝利!</h1><div class="card center"><img src="${G.img}" alt=""><h2 style="margin:8px 0 0">${esc(G.name)}</h2>
  <p style="margin:4px 0">撃破数 ${G.wins} ／ <span class="coin">🪙+${10*B.n}</span></p><p style="margin:0"><b>技に設定できるエネルギーの最大が ${G.max} になった!</b></p></div>
  <div class="row"><button class="big" id="nx">技を育てる</button><button id="sh" style="width:100%">ショップに行く</button></div>`;
  $('#nx').onclick=moves;$('#sh').onclick=shop;
}
function lose(){
  const img=G.img,name=G.name,w=G.wins;
  submitScore();wipe();G=null;app.onclick=null;
  app.innerHTML=`<h1 class="center">カードが力尽きた…</h1><div class="card center dead"><img src="${img}" alt=""><h2 style="margin:8px 0 0">${esc(name)}</h2><p style="margin:4px 0"><small>撃破数 ${w} ／ このカードは失われた</small></p></div>
  <div class="row"><button class="big" id="re">最初から</button><button id="rk" style="width:100%">ランキングを見る</button></div>`;
  $('#re').onclick=draw;$('#rk').onclick=()=>ranking(()=>{G=null;draw()});
}
G=load();if(G&&!G.type)G.type='F';G?title():draw();
</script></body></html>
