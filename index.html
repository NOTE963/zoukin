<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>APEX 1v1 MINI</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0a0a0a;overflow:hidden;font-family:'Segoe UI',sans-serif;}
  #app{position:fixed;top:50%;left:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);transform-origin:center center;}
  #app.rotate{width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg);}

  /* ---- MENU ---- */
  #menu{position:absolute;inset:0;background:linear-gradient(135deg,#1a0000,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:50;}
  #menu h1{color:#ff3b30;font-size:7vmin;letter-spacing:4px;margin:0 0 2vmin;text-shadow:0 0 20px #ff3b30aa;}
  #menu h1 span{color:#fff;}
  .row{display:flex;gap:1.5vmin;margin:1vmin 0;align-items:center;}
  #menu input{background:#1c1c1c;border:2px solid #444;color:#fff;padding:1.4vmin 2vmin;font-size:2.6vmin;border-radius:8px;width:38vmin;text-align:center;}
  #menu button{background:#ff3b30;border:none;color:#fff;padding:1.4vmin 3vmin;font-size:2.4vmin;border-radius:8px;font-weight:bold;letter-spacing:1px;}
  #menu button.sec{background:#333;}
  #menu button:active{filter:brightness(0.8);}
  #status{margin-top:1.5vmin;font-size:2vmin;color:#aaa;min-height:3vmin;text-align:center;}
  #roomShow{font-size:3.4vmin;color:#ffd700;letter-spacing:6px;font-weight:bold;}
  .hint{font-size:1.7vmin;color:#777;margin-top:2vmin;}

  /* ---- ROTATE WARNING ---- */
  #rotWarn{position:fixed;inset:0;background:#000;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999;font-size:3vmin;text-align:center;}
  #rotWarn.show{display:flex;}

  /* ---- GAME ---- */
  #gameWrap{position:absolute;inset:0;display:none;}
  #gameWrap.active{display:block;}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;background:#151515;}

  #hud{position:absolute;top:0;left:0;width:100%;padding:1vmin 2vmin;display:flex;justify-content:space-between;pointer-events:none;z-index:10;}
  .pnl{width:36vmin;color:#fff;}
  .pnl.right{text-align:right;}
  .nm{font-size:1.8vmin;font-weight:bold;text-shadow:0 0 4px #000;}
  .hpbar{height:1.6vmin;background:#000;border:1px solid #555;border-radius:4px;overflow:hidden;margin-top:0.3vmin;}
  .hpfill{height:100%;background:linear-gradient(90deg,#ff3b30,#ff9500);transition:width .15s;}
  .right .hpfill{background:linear-gradient(90deg,#00c3ff,#0066ff);}
  .wname{font-size:1.5vmin;color:#ffd700;margin-top:0.3vmin;}
  #roomTag{position:absolute;top:1vmin;left:50%;transform:translateX(-50%);color:#666;font-size:1.6vmin;z-index:10;}

  #joyZone{position:absolute;left:0;bottom:0;width:48%;height:70%;z-index:20;}
  #joyBase{position:absolute;width:16vmin;height:16vmin;border:2px solid rgba(255,255,255,0.25);border-radius:50%;display:none;}
  #joyStick{position:absolute;width:7vmin;height:7vmin;border-radius:50%;background:rgba(255,255,255,0.35);display:none;}

  #shootBtn{position:absolute;right:4vmin;bottom:6vmin;width:16vmin;height:16vmin;border-radius:50%;background:radial-gradient(circle,#ff3b30cc,#8b0000cc);border:3px solid #fff5;z-index:20;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2vmin;font-weight:bold;}
  #shootBtn:active{filter:brightness(1.3);}

  #resultBox{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:60;}
  #resultBox.show{display:flex;}
  #resultBox h2{font-size:6vmin;color:#ffd700;margin:0;}
  #resultBox button{margin-top:3vmin;background:#ff3b30;border:none;color:#fff;padding:1.5vmin 4vmin;font-size:2.4vmin;border-radius:8px;font-weight:bold;}

  #pickToast{position:absolute;top:8vmin;left:50%;transform:translateX(-50%);color:#ffd700;font-size:2.2vmin;font-weight:bold;opacity:0;transition:opacity .3s;z-index:15;text-shadow:0 0 6px #000;}
</style>
</head>
<body>
<div id="rotWarn">📱<br>横画面にしてください<br><span style="font-size:2vmin;color:#999;">端末を回転させてください</span></div>

<div id="app">
  <div id="menu">
    <h1>APEX <span>1v1 MINI</span></h1>
    <div class="row"><input id="nameInput" placeholder="プレイヤー名" maxlength="8"></div>
    <div class="row">
      <button id="createBtn">ルーム作成</button>
      <input id="joinInput" placeholder="ルームコード" maxlength="4">
      <button id="joinBtn" class="sec">参加</button>
    </div>
    <div id="roomShow"></div>
    <div id="status"></div>
    <div class="hint">1人がルーム作成→コードを相手に伝える→相手が参加でスタート</div>
  </div>

  <div id="gameWrap">
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div class="pnl">
        <div class="nm" id="p1name">YOU</div>
        <div class="hpbar"><div class="hpfill" id="p1hp" style="width:100%"></div></div>
        <div class="wname" id="p1w">P2020</div>
      </div>
      <div class="pnl right">
        <div class="nm" id="p2name">ENEMY</div>
        <div class="hpbar"><div class="hpfill" id="p2hp" style="width:100%"></div></div>
        <div class="wname" id="p2w">P2020</div>
      </div>
    </div>
    <div id="roomTag"></div>
    <div id="pickToast"></div>
    <div id="joyZone"></div>
    <div id="joyBase"></div>
    <div id="joyStick"></div>
    <div id="shootBtn">FIRE</div>
    <div id="resultBox">
      <h2 id="resultTitle">WIN</h2>
      <button id="rematchBtn">もう一度対戦</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDWxhILNkj0RrOV248Bh2zoFZfNq2G-3N0",
  authDomain: "zoukin-kart.firebaseapp.com",
  projectId: "zoukin-kart",
  storageBucket: "zoukin-kart.firebasestorage.app",
  messagingSenderId: "627298939041",
  appId: "1:627298939041:web:3dafaed8c6d267f1d780e0",
  measurementId: "G-DDW4R9EXW5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= COOKIE ================= */
function setCookie(n,v,d){document.cookie=`${n}=${encodeURIComponent(v)};max-age=${d*86400};path=/`;}
function getCookie(n){const m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):'';}
const savedName = getCookie('apex_name');
if(savedName) document.getElementById('nameInput').value = savedName;

/* ================= ROTATE (force landscape) ================= */
const appEl = document.getElementById('app');
const rotWarn = document.getElementById('rotWarn');
function checkOrient(){
  const portrait = window.innerHeight > window.innerWidth;
  appEl.classList.toggle('rotate', portrait);
}
window.addEventListener('resize', checkOrient);
window.addEventListener('orientationchange', checkOrient);
checkOrient();
function tryLockLandscape(){
  const el = document.documentElement;
  if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
  if(screen.orientation && screen.orientation.lock){ screen.orientation.lock('landscape').catch(()=>{}); }
}

/* ================= WEAPONS (Apexライク簡易再現) ================= */
const WEAPONS = [
  {name:"P2020",      dmg:9,  rate:0.30, speed:900,  size:3, ammo:Infinity, color:"#cfcfcf"},
  {name:"R-301カービン", dmg:11, rate:0.11, speed:1000, size:4, ammo:20,       color:"#7CFC00"},
  {name:"スピットファイア", dmg:14, rate:0.10, speed:850,  size:5, ammo:28,       color:"#FFA500"},
  {name:"ウィングマン",   dmg:34, rate:0.48, speed:1150, size:5, ammo:6,        color:"#FF4500"},
  {name:"ピースキーパー",  dmg:15, rate:0.75, speed:800,  size:4, ammo:2,  pellets:4, spread:0.20, color:"#FF1493"},
  {name:"ロングボウDMR",  dmg:42, rate:0.65, speed:1300, size:4, ammo:5,        color:"#00CED1"}
];

/* ================= ARENA ================= */
const AW=900, AH=500, PR=20;
const OBSTACLES=[{x:190,y:130,w:80,h:80},{x:630,y:290,w:80,h:80},{x:380,y:40,w:140,h:26},{x:380,y:434,w:140,h:26}];
const CRATES=[{x:100,y:250},{x:800,y:250},{x:450,y:90},{x:450,y:410}];

function hash(n){n=(n<<13)^n; return ((n*(n*n*15731+789221)+1376312589)&0x7fffffff);}
function crateWeapon(i,t){const w=Math.floor(t/8000);const h=hash(i*97+w+11);return 1+(h%(WEAPONS.length-1));}

/* ================= STATE ================= */
let myName='', roomCode='', mySlot='', oppSlot='', roomRef=null;
let started=false, gameOver=false;
const me = {x:150,y:250,hp:100,weapon:0,ammo:Infinity,angle:0,lastShotTs:0};
const opp = {x:750,y:250,hp:100,weapon:0,name:'ENEMY',angle:0,lastShotTs:0,x0:750,y0:250,x1:750,y1:250,tRecv:0};
let bullets=[];
let localCrateHide=[0,0,0,0];
let joyVec={x:0,y:0};
let shooting=false;

/* ================= UI: MENU ================= */
const menu=document.getElementById('menu');
const gameWrap=document.getElementById('gameWrap');
const statusEl=document.getElementById('status');
const roomShow=document.getElementById('roomShow');

function genCode(){return String(Math.floor(1000+Math.random()*9000));}

document.getElementById('createBtn').onclick=()=>{
  myName = document.getElementById('nameInput').value.trim() || 'PLAYER';
  setCookie('apex_name', myName, 60);
  roomCode = genCode();
  mySlot='p1'; oppSlot='p2';
  roomRef = db.ref('rooms/'+roomCode);
  roomRef.set({
    status:'waiting',
    players:{ p1:{name:myName,x:150,y:250,hp:100,weapon:0,angle:0,lastShotTs:0} }
  });
  roomRef.child('players/p1').onDisconnect().remove();
  roomShow.textContent = 'ルームコード: '+roomCode;
  statusEl.textContent = '相手の参加を待っています…';
  tryLockLandscape();
  roomRef.child('status').on('value', snap=>{
    if(snap.val()==='playing' && !started) startGame();
  });
};

document.getElementById('joinBtn').onclick=()=>{
  myName = document.getElementById('nameInput').value.trim() || 'PLAYER';
  setCookie('apex_name', myName, 60);
  const code = document.getElementById('joinInput').value.trim();
  if(code.length<4){statusEl.textContent='4桁のコードを入力してください';return;}
  roomRef = db.ref('rooms/'+code);
  roomRef.once('value').then(snap=>{
    const v = snap.val();
    if(!v){statusEl.textContent='ルームが見つかりません';return;}
    if(v.players && v.players.p2){statusEl.textContent='このルームは満員です';return;}
    roomCode = code;
    mySlot='p2'; oppSlot='p1';
    roomRef.child('players/p2').set({name:myName,x:750,y:250,hp:100,weapon:0,angle:0,lastShotTs:0});
    roomRef.child('players/p2').onDisconnect().remove();
    roomRef.child('status').set('playing');
    tryLockLandscape();
    startGame();
  });
};

/* ================= START GAME ================= */
function startGame(){
  if(started) return;
  started=true;
  menu.style.display='none';
  gameWrap.classList.add('active');
  document.getElementById('roomTag').textContent = 'ROOM '+roomCode;

  // spawn positions per slot
  if(mySlot==='p1'){ me.x=150; me.y=250; opp.x=opp.x0=opp.x1=750; opp.y=opp.y0=opp.y1=250; }
  else { me.x=750; me.y=250; opp.x=opp.x0=opp.x1=150; opp.y=opp.y0=opp.y1=250; }

  roomRef.child('players/'+oppSlot).on('value', snap=>{
    const v=snap.val();
    if(!v) return;
    opp.name=v.name||'ENEMY';
    opp.x0=opp.x1; opp.y0=opp.y1; opp.tRecv=performance.now();
    opp.x1=v.x; opp.y1=v.y;
    opp.hp=v.hp; opp.weapon=v.weapon; opp.angle=v.angle; opp.lastShotTs=v.lastShotTs;
    document.getElementById('p2name').textContent = opp.name;
    document.getElementById('p2hp').style.width = Math.max(0,opp.hp)+'%';
    document.getElementById('p2w').textContent = WEAPONS[opp.weapon].name;
  });
  document.getElementById('p1name').textContent = myName;

  roomRef.child('hits/'+mySlot).on('child_added', snap=>{
    const h=snap.val();
    if(!h) return;
    me.hp = Math.max(0, me.hp - h.dmg);
    document.getElementById('p1hp').style.width = me.hp+'%';
    snap.ref.remove();
    if(me.hp<=0 && !gameOver){ endGame(false); }
  });

  roomRef.child('status').on('value', snap=>{
    if(snap.val()==='finished' && !gameOver){
      roomRef.child('winner').once('value').then(s=>{
        endGame(s.val()===mySlot);
      });
    }
    if(snap.val()==='playing' && gameOver){
      // rematch
      gameOver=false;
      me.hp=100; me.weapon=0; me.ammo=Infinity;
      document.getElementById('resultBox').classList.remove('show');
      document.getElementById('p1hp').style.width='100%';
    }
  });

  setupControls();
  requestAnimationFrame(loop);
  setInterval(sendState, 80);
}

function sendState(){
  if(!started) return;
  roomRef.child('players/'+mySlot).update({
    x:me.x, y:me.y, hp:me.hp, weapon:me.weapon, angle:me.angle, lastShotTs:me.lastShotTs, name:myName
  });
}

/* ================= END GAME ================= */
function endGame(won){
  gameOver=true;
  document.getElementById('resultTitle').textContent = won? 'WIN!' : 'LOSE...';
  document.getElementById('resultTitle').style.color = won? '#ffd700':'#ff3b30';
  document.getElementById('resultBox').classList.add('show');
  if(won){
    roomRef.child('winner').set(mySlot);
    roomRef.child('status').set('finished');
  }
}
document.getElementById('rematchBtn').onclick=()=>{
  document.getElementById('resultBox').classList.remove('show');
  gameOver=false;
  me.hp=100; me.weapon=0; me.ammo=Infinity; bullets=[];
  if(mySlot==='p1'){ me.x=150; me.y=250; }else{ me.x=750; me.y=250; }
  roomRef.child('players/'+mySlot).update({x:me.x,y:me.y,hp:100,weapon:0});
  if(mySlot==='p1'){ roomRef.child('winner').set(null); roomRef.child('status').set('playing'); }
};

/* ================= CONTROLS ================= */
function setupControls(){
  const joyZone=document.getElementById('joyZone');
  const joyBase=document.getElementById('joyBase');
  const joyStick=document.getElementById('joyStick');
  let joyId=null, baseX=0, baseY=0;
  const maxR = 8; // vmin units approx handled via px below

  function px(vmin){ return vmin/100 * Math.min(window.innerWidth, window.innerHeight); }

  joyZone.addEventListener('touchstart', e=>{
    if(joyId!==null) return;
    const t=e.changedTouches[0];
    joyId=t.identifier;
    const r=joyZone.getBoundingClientRect();
    baseX=t.clientX; baseY=t.clientY;
    joyBase.style.left=(t.clientX-r.left- px(8))+'px';
    joyBase.style.top=(t.clientY-r.top- px(8))+'px';
    joyBase.style.display='block';
    joyStick.style.display='block';
    e.preventDefault();
  },{passive:false});

  joyZone.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches){
      if(t.identifier!==joyId) continue;
      let dx=t.clientX-baseX, dy=t.clientY-baseY;
      const maxPx = px(8);
      const dist=Math.hypot(dx,dy);
      if(dist>maxPx){ dx=dx/dist*maxPx; dy=dy/dist*maxPx; }
      const r=joyZone.getBoundingClientRect();
      joyStick.style.left=(baseX-r.left+dx-px(3.5))+'px';
      joyStick.style.top=(baseY-r.top+dy-px(3.5))+'px';
      joyVec.x = dx/maxPx; joyVec.y = dy/maxPx;
    }
    e.preventDefault();
  },{passive:false});

  function endJoy(e){
    for(const t of e.changedTouches){
      if(t.identifier!==joyId) continue;
      joyId=null; joyVec.x=0; joyVec.y=0;
      joyBase.style.display='none'; joyStick.style.display='none';
    }
  }
  joyZone.addEventListener('touchend', endJoy);
  joyZone.addEventListener('touchcancel', endJoy);

  const shootBtn=document.getElementById('shootBtn');
  shootBtn.addEventListener('touchstart', e=>{ shooting=true; e.preventDefault(); },{passive:false});
  shootBtn.addEventListener('touchend', e=>{ shooting=false; e.preventDefault(); },{passive:false});
  shootBtn.addEventListener('touchcancel', ()=>{ shooting=false; });
}

/* ================= GAME LOGIC ================= */
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
function resize(){ canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight; }
window.addEventListener('resize', resize);
setTimeout(resize,50);

function circleRectPush(cx,cy,r,rect){
  const nx=Math.max(rect.x, Math.min(cx, rect.x+rect.w));
  const ny=Math.max(rect.y, Math.min(cy, rect.y+rect.h));
  const dx=cx-nx, dy=cy-ny;
  const d=Math.hypot(dx,dy);
  if(d<r && d>0.001){
    const push=(r-d);
    return {x:cx+dx/d*push, y:cy+dy/d*push};
  }
  if(d<=0.001){ return {x:cx, y:cy-r}; }
  return null;
}

let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  if(!gameOver) update(dt, now);
  render(now);
  requestAnimationFrame(loop);
}

function update(dt, now){
  // movement
  const spd=230;
  let nx=me.x + joyVec.x*spd*dt;
  let ny=me.y + joyVec.y*spd*dt;
  nx=Math.max(PR,Math.min(AW-PR,nx));
  ny=Math.max(PR,Math.min(AH-PR,ny));
  for(const o of OBSTACLES){
    const p=circleRectPush(nx,ny,PR,o);
    if(p){ nx=p.x; ny=p.y; }
  }
  me.x=nx; me.y=ny;

  // aim (auto toward opponent, interpolated pos)
  const ot=Math.min(1,(now-opp.tRecv)/90);
  const ox=opp.x0+(opp.x1-opp.x0)*ot, oy=opp.y0+(opp.y1-opp.y0)*ot;
  opp.x=ox; opp.y=oy;
  me.angle=Math.atan2(oy-me.y, ox-me.x);

  // shooting
  const w=WEAPONS[me.weapon];
  if(shooting && me.ammo>0 && (now-me.lastShotTs)/1000 >= w.rate){
    me.lastShotTs=now;
    if(me.ammo!==Infinity) me.ammo--;
    const pellets=w.pellets||1;
    for(let i=0;i<pellets;i++){
      const sp = pellets>1 ? (Math.random()-0.5)*w.spread : 0;
      const a=me.angle+sp;
      bullets.push({x:me.x+Math.cos(a)*PR, y:me.y+Math.sin(a)*PR, vx:Math.cos(a)*w.speed, vy:Math.sin(a)*w.speed, dmg:w.dmg, color:w.color});
    }
    if(me.ammo<=0 && me.weapon!==0){ me.weapon=0; me.ammo=Infinity; }
  }

  // bullets update
  bullets = bullets.filter(b=>{
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<0||b.x>AW||b.y<0||b.y>AH) return false;
    for(const o of OBSTACLES){
      if(b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h) return false;
    }
    const d=Math.hypot(b.x-opp.x, b.y-opp.y);
    if(d<PR+3){
      roomRef.child('hits/'+oppSlot).push({dmg:b.dmg, ts:Date.now()});
      return false;
    }
    return true;
  });

  // crate pickup
  CRATES.forEach((c,i)=>{
    if(localCrateHide[i] && now<localCrateHide[i]) return;
    localCrateHide[i]=0;
    const d=Math.hypot(me.x-c.x, me.y-c.y);
    if(d<PR+16){
      const wi=crateWeapon(i, now);
      me.weapon=wi; me.ammo=WEAPONS[wi].ammo;
      localCrateHide[i]=now+1500;
      showToast(WEAPONS[wi].name+' を取得！');
    }
  });

  document.getElementById('p1w').textContent = WEAPONS[me.weapon].name + (me.ammo===Infinity?'':' ('+me.ammo+')');
}

let toastT=0;
function showToast(msg){
  const el=document.getElementById('pickToast');
  el.textContent=msg; el.style.opacity='1'; toastT=performance.now()+1200;
}

function render(now){
  const w=canvas.width, h=canvas.height;
  const scale=Math.min(w/AW, h/AH);
  const ox=(w-AW*scale)/2, oy=(h-AH*scale)/2;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#151515'; ctx.fillRect(0,0,w,h);
  ctx.save();
  ctx.translate(ox,oy); ctx.scale(scale,scale);

  // arena border
  ctx.strokeStyle='#333'; ctx.lineWidth=4; ctx.strokeRect(2,2,AW-4,AH-4);
  // grid
  ctx.strokeStyle='#1e1e1e'; ctx.lineWidth=1;
  for(let gx=0;gx<AW;gx+=50){ ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,AH);ctx.stroke(); }
  for(let gy=0;gy<AH;gy+=50){ ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(AW,gy);ctx.stroke(); }

  // obstacles
  ctx.fillStyle='#4a4a4a';
  OBSTACLES.forEach(o=>{ ctx.fillRect(o.x,o.y,o.w,o.h); ctx.strokeStyle='#777'; ctx.strokeRect(o.x,o.y,o.w,o.h); });

  // crates
  CRATES.forEach((c,i)=>{
    if(localCrateHide[i] && now<localCrateHide[i]) return;
    const wi=crateWeapon(i,now);
    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.rotate(now/600);
    ctx.fillStyle=WEAPONS[wi].color;
    ctx.fillRect(-13,-13,26,26);
    ctx.strokeStyle='#fff8'; ctx.strokeRect(-13,-13,26,26);
    ctx.restore();
  });

  // bullets
  bullets.forEach(b=>{
    ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(b.x,b.y,4,0,7); ctx.fill();
  });

  // opponent muzzle flash (cosmetic)
  if(Date.now()-opp.lastShotTs<90){
    ctx.fillStyle='#fff8';
    ctx.beginPath(); ctx.arc(opp.x+Math.cos(opp.angle)*24, opp.y+Math.sin(opp.angle)*24, 6,0,7); ctx.fill();
  }

  // players
  drawPlayer(me.x, me.y, me.angle, '#00c3ff');
  drawPlayer(opp.x, opp.y, opp.angle, '#ff3b30');

  ctx.restore();

  if(toastT && now>toastT){ document.getElementById('pickToast').style.opacity='0'; toastT=0; }
}

function drawPlayer(x,y,a,color){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(0,0,PR,0,7); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  ctx.rotate(a);
  ctx.fillStyle='#fff';
  ctx.fillRect(PR-4,-3,14,6);
  ctx.restore();
}
</script>
