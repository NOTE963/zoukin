function rankList(){const L=[{n:P.name,k:P.k,d:P.d,me:1}];for(const id in A){const a=A[id];L.push({n:a.n,k:a.k||0,d:a.d||0})}return L.sort((a,b)=>b.k-a.k||a.d-b.d)}
// spawn
function spawn(){let best=sp[0],bd=-1;for(const s of sp){let m=99;for(const id in A){const a=A[id];if(a.a)m=Math.min(m,Math.hypot(a.g.position.x-s[0],a.g.position.z-s[1]))}const r=m+Math.random()*6;if(r>bd){bd=r;best=s}}
P.x=best[0];P.z=best[1];P.y=0;P.vy=0;P.yaw=Math.atan2(best[0],best[1]);P.pitch=0;P.hp=100;P.ammo=12;P.rl=0;P.alive=true;P.prot=1.5;sw(0)}
function sw(i){insp=0;P.w=i;P.rl=0;WP.forEach(w=>w.g.visible=false);WP[i].g.visible=true}
function reload(){if(P.w||P.rl>0||P.ammo>=12)return;P.rl=1.6;snd(500,.1,.3,'square')}
// combat
const rc=new THREE.Raycaster(),holes=[];
function fire(){const w=WP[P.w];if(P.cd>0||P.rl>0||!P.alive||!mode||ended)return;insp=0;
if(P.w==1){P.cd=w.rate;swing=1;snd(300,.1,.2,0,1);const d=new THREE.Vector3();C.getWorldDirection(d);rc.set(C.position.clone(),d);rc.far=2.4;const h=rc.intersectObjects(botMeshes.concat(walls));if(h[0]&&h[0].object.userData.act)hitA(h[0].object.userData.act,w.dmg);return}
if(P.ammo<=0){reload();return}
P.ammo--;P.cd=w.rate;P.shots++;P.rec=Math.min(P.rec+1,18);P.kick=1;shotSnd();
const moving=Math.hypot(P.vx,P.vz)>1,air=!onG;const spread=.001+P.rec*w.sp+(moving?.012:0)+(air?.04:0);
const d=new THREE.Vector3(0,0,-1);d.x+=(Math.random()-.5)*spread*2;d.y+=(Math.random()-.5)*spread*2;d.applyQuaternion(C.quaternion).normalize();
rc.set(C.getWorldPosition(new THREE.Vector3()),d);rc.far=100;const h=rc.intersectObjects(botMeshes.concat(walls));
if(h[0]){const o=h[0].object;if(o.userData.act)hitA(o.userData.act,o.userData.head?w.hs:w.dmg);
else{const m=new THREE.Mesh(new THREE.CircleGeometry(.06,8),new THREE.MeshBasicMaterial({color:0x222222}));const n=h[0].face.normal.clone().transformDirection(o.matrixWorld);
m.position.copy(h[0].point).addScaledVector(n,.01);m.lookAt(h[0].point.clone().add(n));S.add(m);holes.push(m);if(holes.length>50)S.remove(holes.shift())}}
P.pitch+=w.rec*(1+P.rec*.04);P.yaw+=(Math.random()-.5)*w.rec*.8;if(P.ammo==0)reload()}
function hitA(a,d){if(!a.a)return;const hm=$('hm');hm.style.opacity=1;setTimeout(()=>hm.style.opacity=0,120);snd(900,.06,.2,'square');
if(a.bot){a.hp-=d;if(a.hp<=0){a.a=0;a.d++;a.rt=3;P.k++;say(P.name+' → '+a.n)}}
else if(rf)rf.child('ev').push({t:'hit',to:a.id,by:uid,bn:P.name,d})}
function takeHit(e){if(!P.alive||P.prot>0||ended)return;P.hp-=e.d;$('dm').style.opacity=.9;setTimeout(()=>$('dm').style.opacity=0,200);
if(P.hp<=0){P.hp=0;P.alive=false;P.d++;P.rt=3;say(e.bn+' に倒された');if(e.bot)e.bot.k++;else if(rf&&e.by)rf.child('ev').push({t:'kill',to:e.by,n:P.name})}}
// CPU
function botSp(b){const s=sp[Math.random()*sp.length|0];b.g.position.set(s[0],0,s[1]);b.hp=100;b.a=1;b.wx=s[0];b.wz=s[1];b.t=0}
function addBot(i){const id='bot'+i,a=A[id]={id,bot:1,n:'CPU'+(i+1),a:1,hp:100,k:0,d:0,sh:1,t:0,rt:0,g:mkBot(hc(id))};tag(a);botSp(a)}
function mv(b,dx,dz,k){const g=b.g;const nx=g.position.x+dx*k;if(!hit(nx,g.position.z,0,.45))g.position.x=nx;else b.t=0;const nz=g.position.z+dz*k;if(!hit(g.position.x,nz,0,.45))g.position.z=nz;else b.t=0}
function botAI(b,dt){if(!b.a){b.rt-=dt;if(b.rt<=0)botSp(b);return}
const g=b.g,eye=new THREE.Vector3(g.position.x,1.7,g.position.z),pe=C.position,dx=pe.x-g.position.x,dz=pe.z-g.position.z,dist=Math.hypot(dx,dz);
const vis=P.alive&&dist<40&&los(eye,pe);
if(vis){g.rotation.y=Math.atan2(dx,dz)+Math.PI;if(dist>8)mv(b,dx/dist,dz/dist,2.2*dt);b.sh-=dt;
if(b.sh<=0){b.sh=.3+Math.random()*.35;shotSnd(Math.max(.04,.3-dist*.01),1500);if(Math.random()<Math.max(.08,.32-dist*.01)*(Math.hypot(P.vx,P.vz)>3?.7:1))takeHit({d:9+Math.random()*10,bn:b.n,bot:b})}}
else{b.t-=dt;if(b.t<=0||Math.hypot(b.wx-g.position.x,b.wz-g.position.z)<1){b.wx=(Math.random()-.5)*34;b.wz=(Math.random()-.5)*34;b.t=4}
const ax=b.wx-g.position.x,az=b.wz-g.position.z,al=Math.hypot(ax,az)||1;g.rotation.y=Math.atan2(ax,az)+Math.PI;mv(b,ax/al,az/al,2.4*dt)}}
// firebase
let db,rf=null,myRef=null,off=0,tStart=0,mode=0,ended=0,lastEnd=0;
const st=t=>$('st').textContent=t;
function pub(){if(myRef)myRef.set({n:P.name,x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),r:+P.yaw.toFixed(2),a:P.alive?1:0,k:P.k,d:P.d,s:P.shots})}
function onPlayers(sn){const v=sn.val()||{};for(const id in v){if(id===uid)continue;const p=v[id];let a=A[id];
if(!a){a=A[id]={id,g:mkBot(hc(id)),x:p.x,z:p.z,y:0,r:0,s:p.s||0,k:0,d:0,a:1,n:p.n};a.g.position.set(p.x,0,p.z);tag(a)}
if((p.s||0)>a.s)shotSnd(Math.max(.05,.3-Math.hypot(p.x-P.x,p.z-P.z)*.01),1500);
a.s=p.s||0;a.x=p.x;a.z=p.z;a.y=p.y||0;a.r=p.r;a.a=p.a;a.k=p.k;a.d=p.d;a.n=p.n}
for(const id in A)if(!A[id].bot&&!(id in v))rmActor(id)}
async function join(c){try{
if(!window.firebase){st('Firebaseを読み込めません');return 0}
if(!db){firebase.initializeApp(CFG);db=firebase.database()}
off=(await db.ref('.info/serverTimeOffset').once('value')).val()||0;
if(!c){let best=null;for(let i=1;i<=8;i++){const n=(await db.ref('rooms/pub'+i+'/players').once('value')).numChildren();if(n<10&&(n>0||!best)){best='pub'+i;if(n>0)break}}c=best}
if(!c){st('空きルームがありません');return 0}
rf=db.ref('rooms/'+c);const cnt=(await rf.child('players').once('value')).numChildren();
if(cnt>=10){st('満員です(最大10人)');rf=null;return 0}
await rf.child('start').transaction(v=>{const n=Date.now()+off;return(!v||cnt==0||n>v+MATCH+15000)?n:undefined});
tStart=(await rf.child('start').once('value')).val();
myRef=rf.child('players/'+uid);myRef.onDisconnect().remove();P.k=0;P.d=0;P.shots=0;ended=0;mode=2;spawn();pub();
rf.child('players').on('value',onPlayers);
rf.child('ev').on('child_added',s=>{const e=s.val();if(!e||e.to!==uid)return;s.ref.remove();if(e.t=='hit')takeHit(e);else if(e.t=='kill'){P.k++;say(e.n+' を倒した')}});
msg('ルーム '+c+'（'+(cnt+1)+'人）',3000);return 1}
catch(e){st('接続エラー: '+e.message);return 0}}
function leave(){if(rf){rf.child('players').off();rf.child('ev').off();if(myRef){myRef.onDisconnect().cancel();myRef.remove()}}rf=null;myRef=null;for(const id in A)rmActor(id);mode=0;P.alive=false}
function toMenu(){leave();locked=false;if(document.pointerLockElement)document.exitPointerLock();$('ov').style.display='flex'}
function endMatch(){ended=1;const L=rankList();leave();locked=false;if(document.pointerLockElement)document.exitPointerLock();$('ov').style.display='flex';
$('rs').innerHTML='<b style="color:#ffa51f;font-size:22px">終了！</b><br>'+L.map((x,i)=>(i+1)+'位 '+x.n+' '+x.k+'キル / '+x.d+'デス').join('<br>')}
function startCPU(){mode=1;ended=0;off=0;tStart=Date.now();P.k=P.d=0;P.shots=0;for(let i=0;i<5;i++)addBot(i);spawn()}
// input
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='KeyR')reload();if(e.code=='Digit1')sw(0);if(e.code=='Digit2')sw(1);if(e.code=='KeyF')insp=insp>0?insp:1;if(e.code=='Space'&&locked)e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousedown',e=>{if(e.button==0){mouse=true;if(locked)fire()}});addEventListener('mouseup',()=>mouse=false);addEventListener('contextmenu',e=>e.preventDefault());
function look(dx,dy){P.yaw-=dx*.0022;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-dy*.0022))}
addEventListener('mousemove',e=>{if(locked&&!touch)look(e.movementX,e.movementY)});
document.addEventListener('pointerlockchange',()=>{if(touch)return;locked=document.pointerLockElement===R.domElement;$('ov').style.display=locked?'none':'flex'});
const touch='ontouchstart' in window||navigator.maxTouchPoints>0;if(touch)document.body.classList.add('t');
let jx=0,jz=0,jid=null,lid=null,lx=0,ly=0;
function begin(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();$('rs').innerHTML='';
if(touch){locked=true;$('ov').style.display='none';try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}else R.domElement.requestPointerLock()}
$('mn').onclick=async e=>{const m=e.target.dataset.m;if(!m)return;P.name=($('nm').value.trim()||'Player').slice(0,10);st('');
const c=$('pw').value.trim();if(m=='pw'&&!/^[A-Za-z0-9_-]{1,16}$/.test(c)){st('合言葉は英数字・_-で16文字まで');return}
leave();begin();if(m=='cpu'){startCPU();return}
if(!await join(m=='pw'?'k'+c:null))toMenu()};
const act=(a,on)=>{if(a=='f'){mouse=!!on;if(on)fire()}else if(a=='j')keys.Space=on;else if(on){if(a=='r')reload();else if(a=='w')sw(P.w?0:1);else if(a=='i')insp=insp>0?insp:1}};
function jm(t){const r=$('js').getBoundingClientRect();jx=Math.max(-1,Math.min(1,(t.clientX-r.left-r.width/2)/50));jz=Math.max(-1,Math.min(1,(t.clientY-r.top-r.height/2)/50))}
document.addEventListener('touchstart',e=>{if(!locked)return;e.preventDefault();for(const t of e.changedTouches){const b=t.target.closest('.tb');
if(b){b.dataset.id=t.identifier;act(b.dataset.a,1)}else if(t.clientX<innerWidth*.4&&t.clientY>innerHeight*.35&&jid===null){jid=t.identifier;jm(t)}else if(lid===null){lid=t.identifier;lx=t.clientX;ly=t.clientY}}},{passive:false});
document.addEventListener('touchmove',e=>{if(!locked)return;e.preventDefault();for(const t of e.changedTouches){if(t.identifier===jid)jm(t);else if(t.identifier===lid){look((t.clientX-lx)*2.2,(t.clientY-ly)*2.2);lx=t.clientX;ly=t.clientY}}},{passive:false});
const te=e=>{for(const t of e.changedTouches){if(t.identifier===jid){jid=null;jx=jz=0}if(t.identifier===lid)lid=null;document.querySelectorAll('.tb').forEach(b=>{if(b.dataset.id==t.identifier){b.dataset.id='';act(b.dataset.a,0)}})}};
document.addEventListener('touchend',te);document.addEventListener('touchcancel',te);
// loop
function step(){requestAnimationFrame(step);const now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;
if(!locked){R.render(S,C);return}
let left=300;if(mode&&!ended){left=(tStart+MATCH-(Date.now()+off))/1000;if(left<=0){endMatch();return}}
if(mode){if(!P.alive){P.rt-=dt;if(P.rt<=0)spawn()}else P.prot=Math.max(0,P.prot-dt)}
P.cd-=dt;P.rec=Math.max(0,P.rec-dt*(P.cd<=0?10:2));
if(P.rl>0){P.rl-=dt;if(P.rl<=0)P.ammo=12}
if(mouse&&P.w==0&&false)fire();
let fx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx,fz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+jz;const l=Math.max(1,Math.hypot(fx,fz));
const sp0=P.alive?(keys.ShiftLeft?2.8:(P.w==1?6.4:5.6)):0;const c=Math.cos(P.yaw),s=Math.sin(P.yaw);
P.vx=(fx*c+fz*s)/l*sp0;P.vz=(-fx*s+fz*c)/l*sp0;
const nx=P.x+P.vx*dt;if(!hit(nx,P.z,P.y,rad))P.x=nx;const nz=P.z+P.vz*dt;if(!hit(P.x,nz,P.y,rad))P.z=nz;
const g0=gnd(P.x,P.z,P.y);onG=P.y<=g0+.01;if(onG&&keys.Space&&P.alive){P.vy=7.5;onG=false}
P.vy-=22*dt;P.y+=P.vy*dt;const g1=gnd(P.x,P.z,P.y+.35);if(P.y<=g1){P.y=g1;P.vy=0;onG=true}
if(hit(P.x,P.z,P.y+1.7,rad)&&P.vy>0&&!hit(P.x,P.z,P.y,rad))P.vy=0;
if(onG&&sp0>0&&(P.vx||P.vz)){const o=walk;walk+=dt*sp0*1.7;if(sp0>4&&Math.floor(walk/3)!=Math.floor(o/3))snd(90,.05,.08,0,1)}
C.position.set(P.x,P.y+eyeH+Math.sin(walk)*.025*(sp0>0)-(P.alive?0:1.2),P.z);C.rotation.order='YXZ';C.rotation.set(P.pitch,P.yaw,P.alive?0:.6);
P.kick=Math.max(0,P.kick-dt*8);swing=Math.max(0,swing-dt*4);
VM.visible=P.alive;VM.position.set(.22,-.2-(P.rl>0?.12:0)+Math.sin(walk)*.006,-.45+P.kick*.05);VM.rotation.x=P.kick*.06+(P.rl>0?.5:0)-swing*1.1;
const gg=WP[P.w].g;if(insp>0){insp+=dt*.9;const k=insp-1;if(k>=1)insp=0;else{VM.position.set(.08,-.14,-.38);gg.rotation.x=k*Math.PI*6;gg.rotation.z=Math.sin(k*Math.PI)*1.2;gg.rotation.y=Math.sin(k*Math.PI*2)*.5}}
if(insp==0){gunK.rotation.set(0,0,0);gunP.rotation.set(0,0,0)}
if(myRef&&now-lastS>100){lastS=now;pub()}
for(const id in A){const a=A[id],g=a.g;if(a.bot)botAI(a,dt);else{g.position.x+=(a.x-g.position.x)*.35;g.position.z+=(a.z-g.position.z)*.35;g.rotation.y=a.r}
g.position.y=a.a?(a.y||0):.35;g.rotation.x=a.a?0:-Math.PI/2}
$('hp').textContent='♥ '+P.hp;$('am').textContent=P.w?'':(P.rl>0?'リロード':P.ammo+' / ∞');$('wn').textContent=WP[P.w].n;
const t=Math.ceil(left);$('sc').innerHTML=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+' &nbsp;<span style="color:#7f7">KILL '+P.k+'</span>';
if(now-lastR>400){lastR=now;$('rk').innerHTML=rankList().slice(0,6).map((x,i)=>'<div style="position:static;color:'+(x.me?'#ffd24a':'#fff')+'">'+(i+1)+' '+x.n+' '+x.k+'/'+x.d+'</div>').join('')}
if(!P.alive&&mode)$('msg').textContent='リスポーンまで '+Math.ceil(P.rt);else if($('msg').textContent.startsWith('リスポーン'))$('msg').textContent='';
while(feed.length&&feed[0].e<now)feed.shift();$('fd').innerHTML=feed.map(f=>'<div style="position:static;background:#000a;padding:2px 8px;margin:2px;border:1px solid #f55">'+f.t+'</div>').join('');
xh(.001+P.rec*WP[P.w].sp+(Math.hypot(P.vx,P.vz)>1?.012:0)+(onG?0:.04));R.render(S,C)}
sw(0);step();
</script></body></html>
